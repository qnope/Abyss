name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: tool/test.sh --coverage
      - name: Coverage summary
        run: |
          .github/scripts/coverage_summary.sh coverage/lcov.info coverage/badge.json > coverage/summary.md
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- coverage-report -->';
            const body = `${marker}\n${require('fs').readFileSync('coverage/summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Coverage HTML report
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --remove coverage/lcov.info '*.g.dart' '*/l10n/app_localizations*.dart' -o coverage/lcov.info --ignore-errors unused
          genhtml coverage/lcov.info -o coverage/html --quiet
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14
      - name: Enforce coverage minimum
        run: COVERAGE_MIN=97 .github/scripts/coverage_summary.sh coverage/lcov.info > /dev/null

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=web
      - run: flutter pub get
      - run: .github/scripts/generate_app_icons.sh
      - run: .github/scripts/apply_web_splash.sh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release --base-href /Abyss/
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android
      - run: flutter pub get
      - run: .github/scripts/generate_app_icons.sh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

  # The 3D models' scripts (tool/models/), over Blender's Python module: each
  # model builds, stays under its budget, gives the same geometry twice and
  # matches the glb committed in godot/assets/models/.
  models:
    name: Models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install bpy==5.2.3
      - name: Test the model scripts
        working-directory: tool/models
        run: python -m unittest discover -s . -p '*_test.py'

  # The Godot project (godot/), built beside the Flutter app until the switch.
  # Every Godot job has a timeout, so a hung headless Godot cannot run for hours.
  godot-test:
    name: Godot Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: .github/scripts/install_godot.sh "$(cat godot/GODOT_VERSION)"
      - name: Import the project
        # Once more on failure: Godot once crashed while importing a font.
        run: godot --headless --path godot --import || godot --headless --path godot --import
      - run: tool/godot_test.sh
      - name: Test the Python tools
        run: python3 -m unittest discover -s tool -p '*_test.py'
      - name: Coverage
        env:
          # Today's measure. It may be lowered only with the owner's approval.
          COVERAGE_MIN: 100
        run: tool/godot_coverage.py
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/godot/summary.md') != '' }}
        run: cat coverage/godot/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage/godot/summary.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- godot-coverage-report -->';
            const body = `${marker}\n${require('fs').readFileSync('coverage/godot/summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage/godot/lcov.info') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-coverage
          path: coverage/godot
          retention-days: 14

  godot-web:
    name: Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: .github/scripts/install_godot.sh "$(cat godot/GODOT_VERSION)" web
      - name: Export Web
        run: .github/scripts/godot_export.sh Web build/web/index.html
      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: godot/build/web
          retention-days: 7

  godot-android:
    name: Godot Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Godot
        # Godot's first run writes its editor settings, whose Android SDK and
        # Java paths default to the runner's ANDROID_HOME and JAVA_HOME.
        run: .github/scripts/install_godot.sh "$(cat godot/GODOT_VERSION)" android
      - name: Generate a debug keystore
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Export the APK
        # A release build signed with the runner's throwaway debug key: no
        # secret in the repo, and installable for testing.
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: .github/scripts/godot_export.sh Android build/android/abysses.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-apk
          path: godot/build/android/abysses.apk
          retention-days: 7

  godot-ios:
    name: Godot iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: .github/scripts/install_godot.sh "$(cat godot/GODOT_VERSION)" ios
      - name: Export the Xcode project
        # Godot needs a team ID to write the project; the build is unsigned,
        # so a placeholder stands in for the owner's.
        run: |
          perl -pi -e 's/^application\/app_store_team_id=""/application\/app_store_team_id="UNSIGNED00"/' \
            godot/export_presets.cfg
          .github/scripts/godot_export.sh iOS build/ios/abysses.ipa
      - name: Build without code signing
        run: |
          xcodebuild -project godot/build/ios/abysses.xcodeproj -scheme abysses \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath godot/build/ios/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-build
          path: godot/build/ios/derived/Build/Products/Release-iphoneos/abysses.app
          retention-days: 7
