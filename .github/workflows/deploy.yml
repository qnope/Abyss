name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The game is the Godot web export, at the root of the site (/Abyss/). The
  # old address /Abyss/godot/ stays, and sends to the root.
  build:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: .github/scripts/install_godot.sh "$(cat godot/GODOT_VERSION)" web
      - run: tool/godot_test.sh
      - name: Export Web
        run: .github/scripts/godot_export.sh Web build/web/index.html
      - name: Add the old address
        run: |
          mkdir -p godot/build/web/godot
          cp .github/pages/godot_redirect.html godot/build/web/godot/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
