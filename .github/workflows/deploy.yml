name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: tool/test.sh --coverage
      - name: Coverage report
        run: |
          .github/scripts/coverage_summary.sh coverage/lcov.info coverage/badge.json >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --remove coverage/lcov.info '*.g.dart' '*/l10n/app_localizations*.dart' -o coverage/lcov.info --ignore-errors unused
          genhtml coverage/lcov.info -o coverage/html --quiet
          cp coverage/badge.json coverage/html/badge.json
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html

  # The Godot web export, published under /Abyss/godot/ beside the Flutter
  # game. Flutter's base href only rewrites its own index.html, and the
  # flutter_service_worker.js of current Flutter (3.47) only unregisters
  # itself, with no fetch handler, so nothing of Flutter's answers there.
  godot-web:
    name: Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: .github/scripts/install_godot.sh "$(cat godot/GODOT_VERSION)" web
      - run: tool/godot_test.sh
      - name: Export Web
        run: .github/scripts/godot_export.sh Web build/web/index.html
      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: godot/build/web

  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [test, godot-web]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=web
      - run: flutter pub get
      - run: .github/scripts/generate_app_icons.sh
      - run: .github/scripts/apply_web_splash.sh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release --base-href /Abyss/
      - name: Add coverage report to the site
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: build/web/coverage
      - name: Add the Godot demo to the site
        uses: actions/download-artifact@v4
        with:
          name: godot-web
          path: build/web/godot
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
