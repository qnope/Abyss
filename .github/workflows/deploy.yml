name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test --coverage
      - name: Coverage report
        run: |
          .github/scripts/coverage_summary.sh coverage/lcov.info coverage/badge.json >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --remove coverage/lcov.info '*.g.dart' '*/l10n/app_localizations*.dart' -o coverage/lcov.info --ignore-errors unused
          genhtml coverage/lcov.info -o coverage/html --quiet
          cp coverage/badge.json coverage/html/badge.json
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html

  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=web
      - run: flutter pub get
      - run: .github/scripts/generate_app_icons.sh
      - run: .github/scripts/apply_web_splash.sh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release --base-href /Abyss/
      - name: Add coverage report to the site
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: build/web/coverage
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
