<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fhRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A2E36"/>
      <stop offset="1" stop-color="#24121A"/>
    </linearGradient>
    <radialGradient id="fhDome" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#C62840"/>
      <stop offset="0.45" stop-color="#8E2436"/>
      <stop offset="0.85" stop-color="#4A1220"/>
      <stop offset="1" stop-color="#2A0A12"/>
    </radialGradient>
    <linearGradient id="fhBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D4C52"/>
      <stop offset="0.5" stop-color="#3D1F24"/>
      <stop offset="1" stop-color="#1A0A0E"/>
    </linearGradient>
    <radialGradient id="fhGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF1744" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fhEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBEE"/>
      <stop offset="0.4" stop-color="#FF5252"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="fhMaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#7F0000"/>
    </linearGradient>
  </defs>

  <!-- menacing red aura -->
  <ellipse cx="32" cy="42" rx="27" ry="20" fill="url(#fhGlow)" fill-opacity="0.45"/>

  <!-- contact shadow + rocky mound -->
  <ellipse cx="32" cy="57.5" rx="28" ry="4.5" fill="#000" fill-opacity="0.4"/>
  <path d="M4 56 Q6 51 14 50.5 L20 49.6 H45 L51 50.4 Q58 51 60 56 Q57 60.5 32 61 Q7 60.5 4 56 Z" fill="url(#fhRock)" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.8"/>
  <path d="M7 54.5 Q10 51.6 18 51" fill="none" stroke="#A0626C" stroke-width="0.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- bones and debris -->
  <g fill="#D7CCC8" stroke="#3E2723" stroke-width="0.3">
    <path d="M7.5 57.2 L12.5 56.2 L12.8 57 L7.8 58 Z"/>
    <circle cx="7.4" cy="57.6" r="0.6"/>
    <circle cx="12.8" cy="56.4" r="0.6"/>
    <path d="M53 58.6 Q54.4 56.8 56.6 57.4 Q55.6 58.6 54.2 59 Z"/>
  </g>
  <g fill="#4A2A30">
    <ellipse cx="17" cy="59" rx="1.3" ry="0.7"/>
    <ellipse cx="48" cy="59.2" rx="1.1" ry="0.6"/>
  </g>

  <!-- spikes (behind the shell) -->
  <g stroke="#2A0A12" stroke-width="0.4" stroke-linejoin="round">
    <path d="M15.9 42.9 L8.5 44 L15.4 45.5 Z" fill="#C2384A"/>
    <path d="M14.8 48 L8.5 44 L15.4 45.5 Z" fill="#5A0F1C"/>
    <path d="M19.7 37 L9.9 33.5 L18.1 39.2 Z" fill="#C2384A"/>
    <path d="M16.5 41.5 L9.9 33.5 L18.1 39.2 Z" fill="#5A0F1C"/>
    <path d="M21.5 35.3 L18.6 23.8 L24 34 Z" fill="#C2384A"/>
    <path d="M26.5 32.7 L18.6 23.8 L24 34 Z" fill="#7A1A2A"/>
    <path d="M29 32 L32 16 L32 32 Z" fill="#D04055"/>
    <path d="M35 32 L32 16 L32 32 Z" fill="#5A0F1C"/>
    <path d="M37.5 32.7 L45.4 23.8 L40 34 Z" fill="#B0303F"/>
    <path d="M42.5 35.3 L45.4 23.8 L40 34 Z" fill="#4A0C18"/>
    <path d="M44.3 37 L54.1 33.5 L45.9 39.2 Z" fill="#9E2A3A"/>
    <path d="M47.5 41.5 L54.1 33.5 L45.9 39.2 Z" fill="#4A0C18"/>
    <path d="M48.1 42.9 L55.5 44 L48.6 45.5 Z" fill="#9E2A3A"/>
    <path d="M49.2 48 L55.5 44 L48.6 45.5 Z" fill="#4A0C18"/>
  </g>
  <!-- bone-white spike tips -->
  <g fill="#FFCDD2">
    <path d="M8.5 44 L10.4 43.6 L10.2 45 Z"/>
    <path d="M9.9 33.5 L11.6 34.1 L10.8 35.1 Z"/>
    <path d="M18.6 23.8 L19.9 25.2 L19 25.8 Z"/>
    <path d="M32 16 L32.8 19.5 L31.2 19.5 Z"/>
    <path d="M45.4 23.8 L45 25.8 L44.1 25.2 Z"/>
    <path d="M54.1 33.5 L53.2 35.1 L52.4 34.1 Z"/>
    <path d="M55.5 44 L53.8 45 L53.6 43.6 Z"/>
  </g>

  <!-- armoured base band -->
  <path d="M9 50 Q9 47.5 13 47.5 H51 Q55 47.5 55 50 V52.5 Q55 54.5 51 54.5 H13 Q9 54.5 9 52.5 Z" fill="url(#fhBand)" stroke="#0A0E1A" stroke-width="0.6"/>
  <path d="M10 49.3 H54" stroke="#A0626C" stroke-width="0.5" stroke-opacity="0.6"/>
  <g fill="#8E2436" stroke="#1A0A0E" stroke-width="0.3">
    <path d="M13 54.5 L14.5 51.5 L16 54.5 Z"/>
    <path d="M19 54.5 L20.5 51.5 L22 54.5 Z"/>
    <path d="M42 54.5 L43.5 51.5 L45 54.5 Z"/>
    <path d="M48 54.5 L49.5 51.5 L51 54.5 Z"/>
  </g>
  <g fill="#FF5252">
    <circle cx="17.5" cy="51.6" r="1.2" fill-opacity="0.25"/>
    <circle cx="17.5" cy="51.6" r="0.5"/>
    <circle cx="46.5" cy="51.6" r="1.2" fill-opacity="0.25"/>
    <circle cx="46.5" cy="51.6" r="0.5"/>
  </g>

  <!-- dome shell -->
  <path d="M13 48 A19 19 0 0 1 51 48 Z" fill="url(#fhDome)" stroke="#2A0A12" stroke-width="0.7"/>
  <path d="M32 29 A19 19 0 0 1 51 48 H44 Q43 36 32 29 Z" fill="#1A0408" fill-opacity="0.35"/>
  <!-- chitin plate ridges -->
  <g fill="none" stroke="#2A0A12" stroke-width="0.5" stroke-opacity="0.8">
    <path d="M32 29 Q24 33 22 48"/>
    <path d="M32 29 Q40 33 42 48"/>
    <path d="M15.5 38.5 Q32 33.5 48.5 38.5"/>
  </g>
  <g fill="none" stroke="#FF8A80" stroke-width="0.3" stroke-opacity="0.4">
    <path d="M31.3 29.6 Q23.8 33.6 21.6 46"/>
    <path d="M16 38 Q24 35.6 31 35"/>
  </g>
  <!-- stud rivets -->
  <g fill="#2A0A12">
    <circle cx="20.5" cy="36.9" r="0.5"/>
    <circle cx="26.5" cy="35.2" r="0.5"/>
    <circle cx="37.5" cy="35.2" r="0.5"/>
    <circle cx="43.5" cy="36.9" r="0.5"/>
  </g>
  <g fill="#FFCDD2" fill-opacity="0.7">
    <circle cx="20.35" cy="36.75" r="0.18"/>
    <circle cx="26.35" cy="35.05" r="0.18"/>
  </g>
  <!-- glossy highlight -->
  <path d="M16.5 42.5 A16 16 0 0 1 26.5 31.2" fill="none" stroke="#FFCDD2" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.5"/>
  <circle cx="28" cy="30.8" r="0.6" fill="#fff" fill-opacity="0.85"/>
  <path d="M44 33 A18.5 18.5 0 0 1 50.4 46" fill="none" stroke="#FF5252" stroke-width="0.7" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- angry glowing eye slits -->
  <g>
    <circle cx="25" cy="41.5" r="4" fill="#FF1744" fill-opacity="0.2"/>
    <circle cx="39" cy="41.5" r="4" fill="#FF1744" fill-opacity="0.2"/>
    <path d="M20.5 39.5 L29.5 42 L28.5 43.6 L21.5 42.4 Z" fill="#2A0A12"/>
    <path d="M43.5 39.5 L34.5 42 L35.5 43.6 L42.5 42.4 Z" fill="#2A0A12"/>
    <path d="M21.6 40.4 L28.6 42.3 L27.9 43 L22.2 42 Z" fill="url(#fhEye)"/>
    <path d="M42.4 40.4 L35.4 42.3 L36.1 43 L41.8 42 Z" fill="url(#fhEye)"/>
    <circle cx="25" cy="41.9" r="0.45" fill="#fff"/>
    <circle cx="39" cy="41.9" r="0.45" fill="#fff"/>
  </g>

  <!-- fanged maw gate -->
  <path d="M26 48 V46.5 Q26 44 32 44 Q38 44 38 46.5 V48 Z" fill="url(#fhMaw)" stroke="#1A0408" stroke-width="0.6"/>
  <ellipse cx="32" cy="47.4" rx="4" ry="0.8" fill="#FF1744" fill-opacity="0.45"/>
  <g fill="#FFEBEE" stroke="#6D4C52" stroke-width="0.25">
    <path d="M27.2 45.3 L28 47.4 L28.8 45 Z"/>
    <path d="M29.6 44.7 L30.4 47 L31.2 44.5 Z"/>
    <path d="M32.8 44.5 L33.6 47 L34.4 44.7 Z"/>
    <path d="M35.2 45 L36 47.4 L36.8 45.3 Z"/>
  </g>

  <!-- red sparks / toxic bubbles -->
  <g fill="#FF5252" fill-opacity="0.15" stroke="#FF8A80" stroke-width="0.35" stroke-opacity="0.7">
    <circle cx="50" cy="26" r="1"/>
    <circle cx="52" cy="21.5" r="0.65"/>
    <circle cx="13" cy="27" r="0.75"/>
  </g>
</svg>
