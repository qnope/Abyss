<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fnSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A5578"/>
      <stop offset="1" stop-color="#172A45"/>
    </linearGradient>
    <radialGradient id="fnDome" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#B0BEC5"/>
      <stop offset="0.4" stop-color="#78909C"/>
      <stop offset="0.8" stop-color="#455A64"/>
      <stop offset="1" stop-color="#263238"/>
    </radialGradient>
    <linearGradient id="fnBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#90A4AE"/>
      <stop offset="0.5" stop-color="#546E7A"/>
      <stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="fnFlag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E0F7FA"/>
      <stop offset="1" stop-color="#90A4AE"/>
    </linearGradient>
    <linearGradient id="fnPole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CFD8DC"/>
      <stop offset="1" stop-color="#546E7A"/>
    </linearGradient>
    <radialGradient id="fnPort" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#E0F7FA"/>
      <stop offset="0.5" stop-color="#CAE5FF"/>
      <stop offset="1" stop-color="#5C8DB8"/>
    </radialGradient>
  </defs>

  <!-- contact shadow + seabed mound -->
  <ellipse cx="32" cy="57.5" rx="28" ry="4.5" fill="#000" fill-opacity="0.38"/>
  <path d="M4 56 Q7 50.5 18 50 H46 Q57 50.5 60 56 Q57 60.5 32 61 Q7 60.5 4 56 Z" fill="url(#fnSand)" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.7"/>
  <path d="M8 54.5 Q12 51.5 22 51.2" fill="none" stroke="#7FA6CC" stroke-width="0.6" stroke-opacity="0.5" stroke-linecap="round"/>
  <g fill="#566F8F">
    <ellipse cx="9" cy="57.3" rx="1.7" ry="1"/>
    <ellipse cx="14" cy="59" rx="1" ry="0.6"/>
    <ellipse cx="51" cy="58.6" rx="1.5" ry="0.85"/>
    <ellipse cx="56.5" cy="56.4" rx="1" ry="0.6"/>
  </g>
  <g fill="#9EC3E6" fill-opacity="0.6">
    <circle cx="8.5" cy="56.9" r="0.4"/>
    <circle cx="50.6" cy="58.3" r="0.35"/>
  </g>
  <path d="M57.5 56 Q58.2 53.6 57 52 M58.6 56 Q58.4 54.2 59.4 53" fill="none" stroke="#69F0AE" stroke-width="0.6" stroke-linecap="round"/>

  <!-- foundation ring -->
  <path d="M9 50 Q9 47.5 13 47.5 H51 Q55 47.5 55 50 V52.5 Q55 54.5 51 54.5 H13 Q9 54.5 9 52.5 Z" fill="url(#fnBand)" stroke="#0A0E1A" stroke-width="0.6" stroke-opacity="0.8"/>
  <path d="M10 49.3 H54" stroke="#CFD8DC" stroke-width="0.5" stroke-opacity="0.6"/>
  <path d="M18 47.5 V54.5 M26 47.5 V54.5 M38 47.5 V54.5 M46 47.5 V54.5" stroke="#263238" stroke-width="0.35" stroke-opacity="0.8"/>
  <path d="M11 54 H53" stroke="#1DE9B6" stroke-width="0.45" stroke-opacity="0.5"/>

  <!-- metal dome shell -->
  <path d="M12 48 A20 20 0 0 1 52 48 Z" fill="url(#fnDome)" stroke="#1C262B" stroke-width="0.7"/>
  <!-- shadow side -->
  <path d="M32 28 A20 20 0 0 1 52 48 H44 Q43 35 32 28 Z" fill="#1C262B" fill-opacity="0.35"/>
  <!-- plate seams -->
  <g fill="none" stroke="#263238" stroke-width="0.45" stroke-opacity="0.75">
    <path d="M32 28 V48"/>
    <path d="M32 28 Q23 31 21 48"/>
    <path d="M32 28 Q41 31 43 48"/>
    <path d="M15.5 38 Q32 34 48.5 38"/>
  </g>
  <!-- seam highlights -->
  <g fill="none" stroke="#ECEFF1" stroke-width="0.3" stroke-opacity="0.45">
    <path d="M31.6 28.5 V47"/>
    <path d="M15.8 37.6 Q24 35.5 31 34.8"/>
  </g>
  <!-- rivets -->
  <g fill="#37474F">
    <circle cx="20" cy="36.6" r="0.45"/>
    <circle cx="26" cy="35.2" r="0.45"/>
    <circle cx="38" cy="35.2" r="0.45"/>
    <circle cx="44" cy="36.6" r="0.45"/>
    <circle cx="32" cy="31" r="0.45"/>
    <circle cx="27.5" cy="30.3" r="0.45"/>
    <circle cx="36.5" cy="30.3" r="0.45"/>
  </g>
  <g fill="#ECEFF1" fill-opacity="0.8">
    <circle cx="19.85" cy="36.45" r="0.17"/>
    <circle cx="25.85" cy="35.05" r="0.17"/>
    <circle cx="31.85" cy="30.85" r="0.17"/>
    <circle cx="27.35" cy="30.15" r="0.17"/>
  </g>
  <!-- weathering: barnacles and rust streaks -->
  <g fill="#8D9DA6" stroke="#37474F" stroke-width="0.3">
    <circle cx="46.5" cy="44" r="1"/>
    <circle cx="48.3" cy="45.6" r="0.7"/>
    <circle cx="16.5" cy="45.5" r="0.75"/>
  </g>
  <g fill="#263238">
    <circle cx="46.5" cy="44" r="0.35"/>
    <circle cx="48.3" cy="45.6" r="0.25"/>
    <circle cx="16.5" cy="45.5" r="0.28"/>
  </g>
  <path d="M38.5 38.5 Q38.8 41 38.3 43 M26 39 Q25.7 40.5 26.1 42" fill="none" stroke="#8D6E63" stroke-width="0.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- specular highlight -->
  <path d="M15.5 42 A17 17 0 0 1 26 30.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.45"/>
  <circle cx="27.6" cy="30" r="0.6" fill="#fff" fill-opacity="0.8"/>
  <!-- cool rim light -->
  <path d="M44 32.5 A19.5 19.5 0 0 1 51.4 46" fill="none" stroke="#1DE9B6" stroke-width="0.7" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- portholes -->
  <g>
    <circle cx="22" cy="42.5" r="2.6" fill="#37474F" stroke="#1C262B" stroke-width="0.5"/>
    <circle cx="22" cy="42.5" r="1.8" fill="url(#fnPort)"/>
    <circle cx="21.4" cy="41.9" r="0.5" fill="#fff"/>
    <circle cx="42" cy="42.5" r="2.6" fill="#263238" stroke="#1C262B" stroke-width="0.5"/>
    <circle cx="42" cy="42.5" r="1.8" fill="url(#fnPort)"/>
    <circle cx="41.4" cy="41.9" r="0.5" fill="#fff"/>
    <circle cx="22" cy="42.5" r="3.8" fill="#CAE5FF" fill-opacity="0.12"/>
    <circle cx="42" cy="42.5" r="3.8" fill="#CAE5FF" fill-opacity="0.12"/>
  </g>

  <!-- hatch door -->
  <path d="M27 48 V43.5 Q27 40.5 32 40.5 Q37 40.5 37 43.5 V48 Z" fill="#455A64" stroke="#1C262B" stroke-width="0.6"/>
  <path d="M28.6 48 V44 Q28.6 42.1 32 42.1 Q35.4 42.1 35.4 44 V48 Z" fill="#0A0E1A"/>
  <path d="M28.6 45 H35.4 M28.6 46.7 H35.4" stroke="#263238" stroke-width="0.4"/>
  <circle cx="34.3" cy="45.8" r="0.4" fill="#CAE5FF"/>
  <path d="M27.6 44 Q28 41.6 31 41.1" fill="none" stroke="#CFD8DC" stroke-width="0.4" stroke-opacity="0.7"/>

  <!-- flag pole -->
  <rect x="31" y="14" width="2" height="15" rx="0.6" fill="url(#fnPole)" stroke="#263238" stroke-width="0.3"/>
  <circle cx="32" cy="13.5" r="1.3" fill="#CFD8DC" stroke="#455A64" stroke-width="0.35"/>
  <circle cx="31.6" cy="13.1" r="0.4" fill="#fff"/>
  <rect x="30" y="27" width="4" height="2.2" rx="0.6" fill="#546E7A" stroke="#1C262B" stroke-width="0.35"/>

  <!-- white truce flag, waving -->
  <path d="M33 15 Q38 13.5 42 15.5 Q46 17.5 51 15.8 L48.5 20 L51.5 24 Q46.5 25.5 42.5 23.6 Q38 21.6 33 23 Z" fill="url(#fnFlag)" stroke="#78909C" stroke-width="0.45"/>
  <path d="M38 14.8 Q39 19 38.4 22" fill="none" stroke="#90A4AE" stroke-width="0.4" stroke-opacity="0.7"/>
  <path d="M44 16.6 Q44.6 20 44 24" fill="none" stroke="#90A4AE" stroke-width="0.4" stroke-opacity="0.6"/>
  <path d="M33.6 16 Q37 15 40.5 16" fill="none" stroke="#fff" stroke-width="0.6" stroke-linecap="round"/>

  <!-- drifting bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#B2EBF2" stroke-width="0.35" stroke-opacity="0.7">
    <circle cx="16" cy="28" r="1.1"/>
    <circle cx="13.5" cy="23.5" r="0.75"/>
    <circle cx="51" cy="31" r="0.7"/>
  </g>
  <circle cx="15.7" cy="27.7" r="0.3" fill="#fff"/>
</svg>
