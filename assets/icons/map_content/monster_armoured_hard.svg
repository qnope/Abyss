    <path d="M19 53.2 Q32 48.4 45 53.2 Q32 51.6 19 53.2 Z" fill="url(#arPlate)" stroke="#0A0E1A" stroke-width="0.5"/>
    <path d="M21 51.9 Q32 49.2 43 51.9" fill="none" stroke="#E1BEE7" stroke-width="0.45" stroke-opacity="0.6"/>
