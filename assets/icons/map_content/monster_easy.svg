<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="meRock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C96AE"/>
      <stop offset="0.5" stop-color="#4A6178"/>
      <stop offset="1" stop-color="#1E2C3C"/>
    </linearGradient>
    <radialGradient id="meCave" cx="0.5" cy="0.85" r="0.75">
      <stop offset="0" stop-color="#0E4A3A"/>
      <stop offset="0.55" stop-color="#0A1A22"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="meFish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CF5B8"/>
      <stop offset="0.5" stop-color="#2E9D6B"/>
      <stop offset="1" stop-color="#14553A"/>
    </linearGradient>
    <linearGradient id="meFin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D5B"/>
      <stop offset="1" stop-color="#A7FFD4"/>
    </linearGradient>
    <radialGradient id="meBadge" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#66BB6A"/>
      <stop offset="0.6" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </radialGradient>
    <linearGradient id="meStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8FFF3"/>
      <stop offset="0.5" stop-color="#69F0AE"/>
      <stop offset="1" stop-color="#1DB57A"/>
    </linearGradient>
    <radialGradient id="meGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#69F0AE" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#69F0AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="58.5" rx="29" ry="4" fill="#000" fill-opacity="0.4"/>

  <!-- rock lair -->
  <path d="M4 58.5 Q4.5 46 10 39 Q13 34 18 32 Q23 27.5 30 27.2 Q34 26 38 27.6 Q46 29 51 34 Q57 39.5 59 48 Q60 53 60 58.5 Z" fill="url(#meRock)" stroke="#0A0E1A" stroke-width="0.9" stroke-opacity="0.85"/>
  <!-- boulder facets -->
  <g fill="#A9C0D6" fill-opacity="0.45">
    <path d="M10 39 Q13 34 18 32 Q17 37 12.5 40.5 Z"/>
    <path d="M18 32 Q23 27.5 30 27.2 Q27 31 21 33.6 Z"/>
    <path d="M30 27.2 Q34 26 38 27.6 Q35 29.5 31 29.4 Z"/>
  </g>
  <g fill="#0D1B2A" fill-opacity="0.5">
    <path d="M51 34 Q57 39.5 59 48 Q60 53 60 58.5 H54 Q55 46 49 37 Z"/>
    <path d="M38 27.6 Q46 29 51 34 Q46 33.5 41 31 Z"/>
  </g>
  <!-- cracks -->
  <g fill="none" stroke="#0A0E1A" stroke-width="0.45" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M12.5 40.5 Q10 46 9 52"/>
    <path d="M21 33.6 L19 37.5"/>
    <path d="M41 31 L44.5 36 L44 40"/>
    <path d="M53 42 L55.5 47"/>
  </g>
  <path d="M9 44 Q11 37 17 33.4 M22 30 Q27 27.8 33 27.6" fill="none" stroke="#9EC3E6" stroke-width="0.6" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- barnacles -->
  <g fill="#8FA9C4" stroke="#1A2D47" stroke-width="0.3">
    <circle cx="14" cy="47" r="1"/>
    <circle cx="15.6" cy="48.6" r="0.7"/>
    <circle cx="48" cy="45" r="0.9"/>
  </g>
  <g fill="#1A2D47">
    <circle cx="14" cy="47" r="0.35"/>
    <circle cx="15.6" cy="48.6" r="0.25"/>
    <circle cx="48" cy="45" r="0.3"/>
  </g>

  <!-- cave mouth -->
  <path d="M15.5 58.5 Q15 46 21 40.5 Q26 36.4 32 36.5 Q38.5 36.4 43.5 41 Q49 46.5 48.5 58.5 Z" fill="url(#meCave)" stroke="#0A0E1A" stroke-width="0.8"/>
  <path d="M17 50 Q18 42 25 38.2" fill="none" stroke="#1DE9B6" stroke-width="0.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <!-- stalactites -->
  <g fill="#2B4563" stroke="#0A0E1A" stroke-width="0.35">
    <path d="M23 38.6 L24.3 42.6 L25.6 37.6 Z"/>
    <path d="M28.5 36.8 L29.4 40 L30.6 36.6 Z"/>
    <path d="M36.2 36.8 L37.4 41.2 L38.8 37.6 Z"/>
    <path d="M41.2 39.6 L41.9 42 L42.8 40.8 Z"/>
  </g>

  <!-- glow of the creature -->
  <ellipse cx="31" cy="50" rx="12" ry="7" fill="url(#meGlow)"/>

  <!-- small fish peeking out -->
  <g>
    <!-- tail -->
    <path d="M40 49.5 L46.5 45 Q45.4 49.8 46.6 54.5 Z" fill="url(#meFin)" stroke="#0B3A27" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M41.5 49.5 L45.4 47 M41.5 49.8 L45.5 52.6" stroke="#0B3A27" stroke-width="0.3" stroke-opacity="0.6"/>
    <!-- dorsal fin -->
    <path d="M28 45.4 Q32 41 37.5 44.5 Z" fill="#2E9D6B" stroke="#0B3A27" stroke-width="0.4"/>
    <!-- body -->
    <path d="M21 50 Q23.5 44.6 31 44.4 Q38 44.6 41 49.8 Q38 55 31 55.3 Q23.5 55 21 50 Z" fill="url(#meFish)" stroke="#0B3A27" stroke-width="0.6"/>
    <!-- belly -->
    <path d="M23 51.5 Q27 54.5 33 54.3 Q37 53.8 39 51.6 Q32 53 23 51.5 Z" fill="#C8FFE4" fill-opacity="0.55"/>
    <!-- scales -->
    <g fill="none" stroke="#0B3A27" stroke-width="0.3" stroke-opacity="0.55">
      <path d="M31 46.5 Q32.2 47.8 31 49.2"/>
      <path d="M33.5 46.3 Q34.7 47.6 33.5 49"/>
      <path d="M36 47 Q37.2 48.3 36 49.7"/>
      <path d="M32.2 49.5 Q33.4 50.8 32.2 52.2"/>
      <path d="M34.8 49.4 Q36 50.7 34.8 52.1"/>
    </g>
    <!-- gill -->
    <path d="M27.4 46.2 Q29.4 49.8 27.4 53.6" fill="none" stroke="#0B3A27" stroke-width="0.5"/>
    <!-- pectoral fin -->
    <path d="M29 51 Q31.5 50.6 32.6 53.2 Q30 53.4 29 51 Z" fill="#A7FFD4" stroke="#0B3A27" stroke-width="0.3"/>
    <!-- highlight -->
    <path d="M24 48 Q27 45.4 32 45.2" fill="none" stroke="#E8FFF3" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.75"/>
    <!-- eye -->
    <circle cx="25" cy="49" r="2.6" fill="#E0F7FA" stroke="#0B3A27" stroke-width="0.4"/>
    <circle cx="25.4" cy="49.1" r="1.5" fill="#0A0E1A"/>
    <circle cx="24.8" cy="48.4" r="0.55" fill="#fff"/>
    <!-- mouth -->
    <path d="M21.4 50.6 Q22.2 51.2 23 50.8" fill="none" stroke="#0B3A27" stroke-width="0.4" stroke-linecap="round"/>
  </g>

  <!-- algae on the rocks -->
  <path d="M8 58.5 Q7 54 9 50.5 Q10 48 9 45.5 M10 58.5 Q11 55 10.4 52" fill="none" stroke="#2A8C6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M55 58.5 Q56.5 54.5 55 51 Q54 48.6 55.4 46.6" fill="none" stroke="#69F0AE" stroke-width="0.9" stroke-linecap="round"/>
  <!-- pebbles -->
  <g fill="#3A5578" stroke="#0A0E1A" stroke-width="0.3">
    <ellipse cx="13" cy="58.6" rx="2" ry="1.1"/>
    <ellipse cx="51" cy="58.8" rx="1.6" ry="0.9"/>
  </g>

  <!-- bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#B2EBF2" stroke-width="0.35" stroke-opacity="0.8">
    <circle cx="20" cy="42.5" r="0.9"/>
    <circle cx="18.6" cy="39" r="0.6"/>
  </g>

  <!-- difficulty badge: easy, one star -->
  <g>
    <circle cx="32" cy="13" r="11" fill="#69F0AE" fill-opacity="0.15"/>
    <circle cx="32" cy="13" r="9.2" fill="#0A3D14" stroke="#0A0E1A" stroke-width="0.6"/>
    <circle cx="32" cy="13" r="8.2" fill="url(#meBadge)" stroke="#A5D6A7" stroke-width="0.6"/>
    <path d="M25.5 10.5 A7 7 0 0 1 34 6.2" fill="none" stroke="#E8F5E9" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.55"/>
    <g transform="translate(32 13.2)">
      <path d="M0 -5.4 L1.6 -1.7 L5.6 -1.3 L2.6 1.4 L3.5 5.3 L0 3.3 L-3.5 5.3 L-2.6 1.4 L-5.6 -1.3 L-1.6 -1.7 Z" fill="url(#meStar)" stroke="#0B3A27" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5.4 L0 0.3 L-5.6 -1.3 L-1.6 -1.7 Z" fill="#fff" fill-opacity="0.35"/>
      <circle cx="-0.8" cy="-2.2" r="0.5" fill="#fff"/>
    </g>
  </g>
</svg>
