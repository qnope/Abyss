<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mhRock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E3A44"/>
      <stop offset="0.5" stop-color="#3D1F24"/>
      <stop offset="1" stop-color="#1A0B0E"/>
    </linearGradient>
    <radialGradient id="mhCave" cx="0.5" cy="0.75" r="0.75">
      <stop offset="0" stop-color="#4A0A14"/>
      <stop offset="0.6" stop-color="#14060A"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>
    <radialGradient id="mhHead" cx="0.38" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#D2475A"/>
      <stop offset="0.5" stop-color="#8E2436"/>
      <stop offset="1" stop-color="#3A0C16"/>
    </radialGradient>
    <linearGradient id="mhTent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C23A4E"/>
      <stop offset="1" stop-color="#5A1020"/>
    </linearGradient>
    <linearGradient id="mhEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF59D"/>
      <stop offset="0.5" stop-color="#FF9100"/>
      <stop offset="1" stop-color="#D50000"/>
    </linearGradient>
    <radialGradient id="mhGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF1744" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mhBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF5350"/>
      <stop offset="0.5" stop-color="#C62828"/>
      <stop offset="1" stop-color="#7F0000"/>
    </linearGradient>
    <linearGradient id="mhStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFCDD2"/>
      <stop offset="1" stop-color="#EF9A9A"/>
    </linearGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="59" rx="30" ry="4" fill="#000" fill-opacity="0.42"/>

  <!-- rock lair -->
  <path d="M2.5 59 Q3 45 9 37.5 Q13 32.5 18.5 30.5 Q24 26.5 31 26.5 Q35 25.5 39 27 Q47 28.5 52 33.5 Q58.5 39.5 60.5 48 Q61.5 53 61.5 59 Z" fill="url(#mhRock)" stroke="#0A0E1A" stroke-width="0.7" stroke-opacity="0.85"/>
  <g fill="#A0626C" fill-opacity="0.45">
    <path d="M9 37.5 Q13 32.5 18.5 30.5 Q17 36 11.5 39.5 Z"/>
    <path d="M18.5 30.5 Q24 26.5 31 26.5 Q28 30.4 21.5 32.6 Z"/>
    <path d="M31 26.5 Q35 25.5 39 27 Q36 29 32 28.8 Z"/>
  </g>
  <g fill="#0A0406" fill-opacity="0.5">
    <path d="M52 33.5 Q58.5 39.5 60.5 48 Q61.5 53 61.5 59 H55.5 Q56 46 50 37 Z"/>
    <path d="M39 27 Q47 28.5 52 33.5 Q47 33 42 30.6 Z"/>
  </g>
  <g fill="none" stroke="#0A0E1A" stroke-width="0.45" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M11.5 39.5 Q9 45 8 51"/>
    <path d="M21.5 32.6 L19.5 36.5"/>
    <path d="M42 30.6 L45 35 L44.6 39"/>
  </g>
  <path d="M8 43 Q10 36 16.5 32.6 M22 29.4 Q27 27.2 34 27" fill="none" stroke="#E0A0A8" stroke-width="0.6" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- skulls & bones of victims -->
  <g fill="#D7CCC8" stroke="#3E2723" stroke-width="0.3">
    <path d="M10.5 44.5 Q10.5 42 12.8 42 Q15 42 15 44.5 Q15 45.6 14 45.8 V46.6 H11.6 V45.8 Q10.5 45.6 10.5 44.5 Z"/>
    <path d="M51 41.8 L56 40.6 L56.2 41.4 L51.2 42.6 Z"/>
  </g>
  <g fill="#3E2723">
    <circle cx="11.9" cy="44.2" r="0.55"/>
    <circle cx="13.7" cy="44.2" r="0.55"/>
  </g>

  <!-- cave mouth -->
  <path d="M13.5 59 Q13 45 19.5 39.2 Q25 35 32 35 Q39 35 44.5 39.6 Q51 45.5 50.5 59 Z" fill="url(#mhCave)" stroke="#0A0E1A" stroke-width="0.8"/>
  <ellipse cx="32" cy="48" rx="16" ry="11" fill="url(#mhGlow)"/>

  <!-- tentacle reaching up over the rock (behind head) -->
  <path d="M40 44 Q47.5 38.5 49.6 32.6 Q50.6 29.6 48.6 29.4 Q47.2 29.6 47.8 31.4 Q46 36.4 38.6 41 Z" fill="url(#mhTent)" stroke="#2A0A12" stroke-width="0.5"/>
  <g fill="#FFCDD2" fill-opacity="0.85">
    <circle cx="42.2" cy="41" r="0.5"/>
    <circle cx="44.6" cy="39" r="0.45"/>
    <circle cx="46.6" cy="36.6" r="0.4"/>
    <circle cx="47.8" cy="34" r="0.35"/>
  </g>

