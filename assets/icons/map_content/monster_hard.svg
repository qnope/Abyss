  <path d="M20.5 55 Q18.5 44 23 39.5 Q27 36 32 36 Q37 36 41 39.5 Q45.5 44 43.5 55 Z" fill="url(#mhHead)" stroke="#2A0A12" stroke-width="0.7"/>
  <!-- mantle spots and ridges -->
  <g fill="#FF8A80" fill-opacity="0.45">
    <circle cx="26" cy="40.5" r="0.7"/>
    <circle cx="29.5" cy="38.6" r="0.5"/>
    <circle cx="36" cy="38.8" r="0.55"/>
    <circle cx="39.5" cy="41.5" r="0.45"/>
  </g>
  <path d="M22.5 45 Q24 39 30 37.2" fill="none" stroke="#FFCDD2" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M42 43.5 Q43.4 48 42.8 53" fill="none" stroke="#FF5252" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- angry eyes -->
  <circle cx="26.5" cy="46.5" r="3.6" fill="#FF9100" fill-opacity="0.22"/>
  <circle cx="37.5" cy="46.5" r="3.6" fill="#FF9100" fill-opacity="0.22"/>
  <path d="M22.6 44.4 L29.6 46.4 Q28.6 49 25.8 48.6 Q23.2 48 22.6 44.4 Z" fill="url(#mhEye)" stroke="#2A0A12" stroke-width="0.5"/>
  <path d="M41.4 44.4 L34.4 46.4 Q35.4 49 38.2 48.6 Q40.8 48 41.4 44.4 Z" fill="url(#mhEye)" stroke="#2A0A12" stroke-width="0.5"/>
  <rect x="25.6" y="45.6" width="1.4" height="2.8" rx="0.6" fill="#0A0E1A"/>
  <rect x="37" y="45.6" width="1.4" height="2.8" rx="0.6" fill="#0A0E1A"/>
  <circle cx="25" cy="45.8" r="0.4" fill="#fff"/>
  <circle cx="36.4" cy="45.8" r="0.4" fill="#fff"/>
  <path d="M21.8 43.4 L30 45.6 M42.2 43.4 L34 45.6" stroke="#2A0A12" stroke-width="0.9" stroke-linecap="round"/>
  <!-- fanged beak -->
  <path d="M27 51 Q32 49.6 37 51 Q35.6 54.6 32 55 Q28.4 54.6 27 51 Z" fill="#1A0408" stroke="#2A0A12" stroke-width="0.5"/>
  <g fill="#FFEBEE" stroke="#6D4C52" stroke-width="0.25" stroke-linejoin="round">
    <path d="M28.2 50.8 L29 53.2 L29.9 50.5 Z"/>
    <path d="M31.1 50.3 L32 53.8 L32.9 50.3 Z"/>
    <path d="M34.1 50.5 L35 53.2 L35.8 50.8 Z"/>
  </g>

  <!-- side tentacles curling over the seabed -->
  <g stroke="#2A0A12" stroke-width="0.55" stroke-linejoin="round">
    <path d="M21 50 Q11 47.5 7 53.5 Q5.3 57.6 8.6 58.6 Q11.2 59 11.2 57 Q9.4 57.4 9.6 55.4 Q11.4 51.6 21 55 Z" fill="url(#mhTent)"/>
    <path d="M43 50 Q53 47.5 57 53.5 Q58.7 57.6 55.4 58.6 Q52.8 59 52.8 57 Q54.6 57.4 54.4 55.4 Q52.6 51.6 43 55 Z" fill="url(#mhTent)"/>
    <path d="M24.5 53.5 Q23 60 16 61 Q13.6 61.2 14 59.8 Q19.6 59.2 21.6 53.2 Z" fill="url(#mhTent)"/>
    <path d="M39.5 53.5 Q41 60 48 61 Q50.4 61.2 50 59.8 Q44.4 59.2 42.4 53.2 Z" fill="url(#mhTent)"/>
  </g>
  <!-- tentacle highlights -->
  <path d="M19 50 Q11.5 48.6 8.3 53.8 M45 50 Q52.5 48.6 55.7 53.8" fill="none" stroke="#FF8A80" stroke-width="0.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- suckers -->
  <g fill="#FFCDD2" stroke="#8E2436" stroke-width="0.2">
    <circle cx="17.5" cy="53.4" r="0.6"/>
    <circle cx="14.6" cy="53" r="0.55"/>
    <circle cx="12" cy="53.6" r="0.5"/>
    <circle cx="10.4" cy="55.4" r="0.42"/>
    <circle cx="46.5" cy="53.4" r="0.6"/>
    <circle cx="49.4" cy="53" r="0.55"/>
    <circle cx="52" cy="53.6" r="0.5"/>
    <circle cx="53.6" cy="55.4" r="0.42"/>
    <circle cx="21.4" cy="56.6" r="0.5"/>
    <circle cx="19.6" cy="58.8" r="0.42"/>
    <circle cx="42.6" cy="56.6" r="0.5"/>
    <circle cx="44.4" cy="58.8" r="0.42"/>
  </g>

  <!-- pebbles -->
  <g fill="#4A2A30" stroke="#0A0E1A" stroke-width="0.3">
    <ellipse cx="4.6" cy="59.4" rx="1.4" ry="0.8"/>
    <ellipse cx="59.4" cy="59.4" rx="1.4" ry="0.8"/>
  </g>

  <!-- blood-red bubbles -->
  <g fill="#FF5252" fill-opacity="0.15" stroke="#FF8A80" stroke-width="0.35" stroke-opacity="0.7">
    <circle cx="17" cy="39" r="0.9"/>
    <circle cx="15.6" cy="35.4" r="0.6"/>
    <circle cx="53.5" cy="29" r="0.7"/>
  </g>

  <!-- difficulty badge: hard, three stars -->
  <g>
    <rect x="7" y="1.6" width="50" height="21.4" rx="10.7" fill="#FF1744" fill-opacity="0.15"/>
    <rect x="9" y="3" width="46" height="18.4" rx="9.2" fill="#4A0000" stroke="#0A0E1A" stroke-width="0.6"/>
    <rect x="10.2" y="4.2" width="43.6" height="16" rx="8" fill="url(#mhBadge)" stroke="#FFCDD2" stroke-width="0.5"/>
    <path d="M13.6 8.8 Q14.6 6 18.6 5.8 H44" fill="none" stroke="#FFEBEE" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.55"/>
    <g transform="translate(20.5 12.4)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mhStar)" stroke="#4A0000" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.4"/>
    </g>
    <g transform="translate(32 12.4)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mhStar)" stroke="#4A0000" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.4"/>
    </g>
    <g transform="translate(43.5 12.4)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mhStar)" stroke="#4A0000" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.4"/>
    </g>
  </g>
</svg>
