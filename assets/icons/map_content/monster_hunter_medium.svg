<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flRock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E6B78"/>
      <stop offset="0.55" stop-color="#36404C"/>
      <stop offset="1" stop-color="#151B24"/>
    </linearGradient>
    <radialGradient id="flCave" cx="0.5" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#1B2A3A"/>
      <stop offset="0.6" stop-color="#0A1018"/>
      <stop offset="1" stop-color="#03050A"/>
    </radialGradient>
    <linearGradient id="huMantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset="0.5" stop-color="#D32F2F"/>
      <stop offset="1" stop-color="#5D0B0B"/>
    </linearGradient>
    <radialGradient id="huEye" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.5" stop-color="#FFEB3B"/>
      <stop offset="1" stop-color="#F57F17"/>
    </radialGradient>
    <linearGradient id="mmBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE57F"/>
      <stop offset="0.45" stop-color="#D4A800"/>
      <stop offset="1" stop-color="#8D6E00"/>
    </linearGradient>
    <linearGradient id="mmStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.5" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="59" rx="29" ry="3.8" fill="#000" fill-opacity="0.4"/>
  <!-- rock lair -->
  <path d="M3.5 59 Q4 47 9.5 40 Q13 34.5 19 32.5 Q24 28 31 28 Q38 27.5 44 30.5 Q51 33.5 55 39.5 Q59.5 46 60.5 59 Z" fill="url(#flRock)" stroke="#0A0E1A" stroke-width="0.7" stroke-opacity="0.85"/>
  <path d="M9.5 40 Q13 34.5 19 32.5 Q17.5 37.5 12.5 41.5 Z M24 29.6 Q31 27.4 38 28.4 Q32 30.6 26 31.4 Z" fill="#8FA0B0" fill-opacity="0.35"/>
  <path d="M55 39.5 Q59.5 46 60.5 59 H54.5 Q55 47 50 38 Z" fill="#0A0E14" fill-opacity="0.5"/>
  <g fill="none" stroke="#0A0E1A" stroke-width="0.45" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M12.5 41.5 Q10 47 9 53"/><path d="M44 30.5 L46 35.5"/><path d="M53 43 L55.5 48.5"/>
  </g>
  <g fill="#B0BEC5" fill-opacity="0.55" stroke="#263238" stroke-width="0.3">
    <circle cx="11" cy="47" r="1.1"/><circle cx="13" cy="49.5" r="0.8"/><circle cx="52" cy="45" r="1"/>
  </g>
  <!-- cave mouth -->
  <path d="M15 59 Q15.5 46 21.5 40.5 Q26.5 36 32 36 Q37.5 36 42.5 40.5 Q48.5 46 49 59 Z" fill="url(#flCave)" stroke="#05070D" stroke-width="0.6"/>
  <path d="M21.5 40.5 L23 43.5 L24.5 40 M38.5 39.5 L40 43 L41.6 40.6" fill="#36404C" stroke="#0A0E1A" stroke-width="0.35"/>

  <!-- seabed -->
  <path d="M3.5 59 Q18 56.5 32 57.5 Q46 56.5 60.5 59 Z" fill="#1E2833"/>
  <g fill="#2E7D32" fill-opacity="0.85">
    <path d="M6 59 Q5 54 7.5 50.5 Q7 54.5 8 59 Z"/><path d="M57 59 Q58.5 54.5 56.5 51 Q58.8 54 59.2 59 Z"/>
  </g>

  <!-- hunting squid darting out of the cave -->
  <g fill="none" stroke-linecap="round">
    <path d="M28 46 Q20 49 15 55.5 Q13 58 10 57" stroke="#B71C1C" stroke-width="2.2"/>
    <path d="M30 48 Q26 53 24.5 58.5" stroke="#C62828" stroke-width="1.9"/>
    <path d="M34 48 Q38 53 39.5 58.5" stroke="#C62828" stroke-width="1.9"/>
    <path d="M36 46 Q44 49 49 55.5 Q51 58 54 57" stroke="#B71C1C" stroke-width="2.2"/>
    <path d="M31 47 Q31 53 29 59" stroke="#8E1A1A" stroke-width="1.6"/>
    <path d="M33 47 Q33 53 35 59" stroke="#8E1A1A" stroke-width="1.6"/>
  </g>
  <g fill="#FFCDD2" fill-opacity="0.8">
    <circle cx="17" cy="53" r="0.5"/><circle cx="14.5" cy="56" r="0.45"/><circle cx="47" cy="53" r="0.5"/><circle cx="49.5" cy="56" r="0.45"/>
  </g>
  <!-- arrow-shaped mantle -->
  <path d="M32 24.5 Q38.5 33 38 41 Q37.5 46.5 32 48 Q26.5 46.5 26 41 Q25.5 33 32 24.5 Z" fill="url(#huMantle)" stroke="#0A0E1A" stroke-width="0.6"/>
  <path d="M32 24.5 L23.5 31 Q27 32 28 34 Z M32 24.5 L40.5 31 Q37 32 36 34 Z" fill="#E53935" stroke="#0A0E1A" stroke-width="0.5"/>
  <g fill="#7F0000" fill-opacity="0.55">
    <circle cx="30" cy="33" r="0.8"/><circle cx="34" cy="35" r="0.9"/><circle cx="31" cy="38" r="0.7"/><circle cx="35" cy="31" r="0.6"/>
  </g>
  <path d="M29 30 Q31 27 32 26.5" fill="none" stroke="#FFEBEE" stroke-width="0.7" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- fierce eyes -->
  <ellipse cx="28.3" cy="43" rx="2.2" ry="2" fill="url(#huEye)" stroke="#0A0E1A" stroke-width="0.4"/>
  <ellipse cx="35.7" cy="43" rx="2.2" ry="2" fill="url(#huEye)" stroke="#0A0E1A" stroke-width="0.4"/>
  <path d="M28.3 41.6 V44.4 M35.7 41.6 V44.4" stroke="#0A0E1A" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M25.6 40.8 L30.6 41.8 M38.4 40.8 L33.4 41.8" stroke="#3E0000" stroke-width="0.8" stroke-linecap="round"/>

  <!-- difficulty badge: medium, two stars -->
  <g>
    <rect x="14.5" y="2" width="35" height="21" rx="10.5" fill="#FFD740" fill-opacity="0.15"/>
    <rect x="16.5" y="3.5" width="31" height="18" rx="9" fill="#5C4700" stroke="#0A0E1A" stroke-width="0.6"/>
    <rect x="17.6" y="4.6" width="28.8" height="15.8" rx="7.9" fill="url(#mmBadge)" stroke="#FFF59D" stroke-width="0.5"/>
    <path d="M21 9 Q22 6.2 26 6 H38" fill="none" stroke="#FFFDE7" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.6"/>
    <g transform="translate(25 12.6)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mmStar)" stroke="#5C4700" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.35"/>
      <circle cx="-0.8" cy="-2" r="0.45" fill="#fff"/>
    </g>
    <g transform="translate(39 12.6)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mmStar)" stroke="#5C4700" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.35"/>
      <circle cx="-0.8" cy="-2" r="0.45" fill="#fff"/>
    </g>
  </g>
</svg>
