<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mmRock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A6744"/>
      <stop offset="0.5" stop-color="#4A3F2A"/>
      <stop offset="1" stop-color="#211B10"/>
    </linearGradient>
    <radialGradient id="mmCave" cx="0.5" cy="0.8" r="0.75">
      <stop offset="0" stop-color="#3A2A0A"/>
      <stop offset="0.55" stop-color="#140F08"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>
    <radialGradient id="mmBody" cx="0.4" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#8D6E63"/>
      <stop offset="0.55" stop-color="#5D4037"/>
      <stop offset="1" stop-color="#2B1A14"/>
    </radialGradient>
    <linearGradient id="mmMouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0606"/>
      <stop offset="1" stop-color="#6A1B2A"/>
    </linearGradient>
    <radialGradient id="mmEye" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="0.5" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </radialGradient>
    <radialGradient id="mmLure" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8E1" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#FFD740" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD740" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE57F"/>
      <stop offset="0.45" stop-color="#D4A800"/>
      <stop offset="1" stop-color="#8D6E00"/>
    </linearGradient>
    <linearGradient id="mmStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.5" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="58.5" rx="29" ry="4" fill="#000" fill-opacity="0.4"/>

  <!-- rock lair -->
  <path d="M4 58.5 Q4.5 46 10 39 Q13 34 18 32 Q23 27.5 30 27.2 Q34 26 38 27.6 Q46 29 51 34 Q57 39.5 59 48 Q60 53 60 58.5 Z" fill="url(#mmRock)" stroke="#0A0E1A" stroke-width="0.7" stroke-opacity="0.85"/>
  <g fill="#9C875C" fill-opacity="0.5">
    <path d="M10 39 Q13 34 18 32 Q17 37 12.5 40.5 Z"/>
    <path d="M18 32 Q23 27.5 30 27.2 Q27 31 21 33.6 Z"/>
    <path d="M30 27.2 Q34 26 38 27.6 Q35 29.5 31 29.4 Z"/>
  </g>
  <g fill="#120E08" fill-opacity="0.5">
    <path d="M51 34 Q57 39.5 59 48 Q60 53 60 58.5 H54 Q55 46 49 37 Z"/>
    <path d="M38 27.6 Q46 29 51 34 Q46 33.5 41 31 Z"/>
  </g>
  <!-- cracks and strata -->
  <g fill="none" stroke="#0A0E1A" stroke-width="0.45" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M12.5 40.5 Q10 46 9 52"/>
    <path d="M21 33.6 L19 37.5"/>
    <path d="M41 31 L44.5 36 L44 40"/>
    <path d="M53 42 L55.5 47"/>
  </g>
  <path d="M9 44 Q11 37 17 33.4 M22 30 Q27 27.8 33 27.6" fill="none" stroke="#D7C49A" stroke-width="0.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- fish skull embedded in rock -->
  <g fill="#D7CCC8" stroke="#3E2723" stroke-width="0.3">
    <path d="M48.5 44 Q50.5 42.2 52.6 43.4 L54.2 42.8 L53.6 44.6 Q51.5 46.2 48.5 44 Z"/>
  </g>
  <circle cx="50.2" cy="43.8" r="0.45" fill="#3E2723"/>
  <!-- barnacles -->
  <g fill="#B0A080" stroke="#2C2619" stroke-width="0.3">
    <circle cx="14" cy="47" r="1"/>
    <circle cx="15.6" cy="48.6" r="0.7"/>
  </g>
  <g fill="#2C2619">
    <circle cx="14" cy="47" r="0.35"/>
    <circle cx="15.6" cy="48.6" r="0.25"/>
  </g>

  <!-- cave mouth -->
  <path d="M15.5 58.5 Q15 46 21 40.5 Q26 36.4 32 36.5 Q38.5 36.4 43.5 41 Q49 46.5 48.5 58.5 Z" fill="url(#mmCave)" stroke="#0A0E1A" stroke-width="0.8"/>
  <g fill="#4A3F2A" stroke="#0A0E1A" stroke-width="0.35">
    <path d="M22.5 39 L23.6 42 L24.8 38 Z"/>
    <path d="M38.2 37.4 L39.2 40.4 L40.4 38.4 Z"/>
  </g>

  <!-- anglerfish -->
  <g>
    <!-- back fins -->
    <path d="M18 50 L15.6 46 L19.8 47.4 Z M46 50 L48.4 46 L44.2 47.4 Z" fill="#4E342E" stroke="#1A0E0A" stroke-width="0.4"/>
    <!-- head -->
    <path d="M17.6 58.5 Q16.8 47 22.5 42.6 Q27 39.6 32 39.6 Q37 39.6 41.5 42.6 Q47.2 47 46.4 58.5 Z" fill="url(#mmBody)" stroke="#1A0E0A" stroke-width="0.7"/>
    <!-- skin spots -->
    <g fill="#A1887F" fill-opacity="0.5">
      <circle cx="24" cy="44.5" r="0.6"/>
      <circle cx="29" cy="42" r="0.5"/>
      <circle cx="35" cy="42.2" r="0.45"/>
      <circle cx="21" cy="48" r="0.5"/>
    </g>
    <path d="M21 46 Q24 41.6 30 40.7" fill="none" stroke="#BCAAA4" stroke-width="0.7" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M44 46 Q45.8 50 45.6 56" fill="none" stroke="#FFD740" stroke-width="0.5" stroke-opacity="0.45" stroke-linecap="round"/>
    <!-- gaping mouth -->
    <path d="M19.5 50.5 Q32 47 44.5 50.5 Q43 57.8 32 58 Q21 57.8 19.5 50.5 Z" fill="url(#mmMouth)" stroke="#1A0E0A" stroke-width="0.6"/>
    <!-- upper fangs -->
    <g fill="#FFF8E1" stroke="#5D4037" stroke-width="0.25" stroke-linejoin="round">
      <path d="M21 50.3 L22.2 54 L23.2 49.8 Z"/>
      <path d="M24.2 49.6 L25.8 55 L27 49.2 Z"/>
      <path d="M28.2 49 L29.4 52.6 L30.4 48.8 Z"/>
      <path d="M31.4 48.7 L32.6 54.2 L33.8 48.7 Z"/>
      <path d="M35 48.9 L36 52.4 L37.2 49.1 Z"/>
      <path d="M37.8 49.2 L39 54.6 L40.4 49.6 Z"/>
      <path d="M41 49.9 L41.9 53.4 L43 50.3 Z"/>
    </g>
    <!-- lower fangs -->
    <g fill="#FFECB3" stroke="#5D4037" stroke-width="0.25" stroke-linejoin="round">
      <path d="M22.6 56.6 L24 53.4 L25 57.2 Z"/>
      <path d="M27 57.6 L28.2 54.6 L29.2 57.8 Z"/>
      <path d="M34.6 57.8 L35.8 54.4 L37 57.6 Z"/>
      <path d="M39.2 57.2 L40.4 53.6 L41.4 56.6 Z"/>
    </g>
    <!-- eyes -->
    <circle cx="25.5" cy="45.5" r="3.6" fill="#FFD740" fill-opacity="0.2"/>
    <circle cx="38.5" cy="45.5" r="3.6" fill="#FFD740" fill-opacity="0.2"/>
    <circle cx="25.5" cy="45.5" r="2.4" fill="url(#mmEye)" stroke="#1A0E0A" stroke-width="0.5"/>
    <circle cx="38.5" cy="45.5" r="2.4" fill="url(#mmEye)" stroke="#1A0E0A" stroke-width="0.5"/>
    <ellipse cx="25.7" cy="45.6" rx="0.6" ry="1.5" fill="#0A0E1A"/>
    <ellipse cx="38.3" cy="45.6" rx="0.6" ry="1.5" fill="#0A0E1A"/>
    <circle cx="24.8" cy="44.7" r="0.5" fill="#fff"/>
    <circle cx="37.8" cy="44.7" r="0.5" fill="#fff"/>
    <!-- brow ridges -->
    <path d="M22.5 43 L28 43.8 M41.5 43 L36 43.8" stroke="#2B1A14" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- lure stalk and glowing bulb -->
  <path d="M32 40 Q32 32 38 30.5 Q42.5 29.6 43.5 33" fill="none" stroke="#2B1A14" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M32 40 Q32 32 38 30.5 Q42.5 29.6 43.5 33" fill="none" stroke="#A1887F" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="43.6" cy="35" r="7" fill="url(#mmLure)"/>
  <circle cx="43.6" cy="35" r="2.2" fill="#FFD740" stroke="#FF8F00" stroke-width="0.4"/>
  <circle cx="43.6" cy="35" r="1.2" fill="#FFF8E1"/>
  <circle cx="42.9" cy="34.3" r="0.45" fill="#fff"/>

  <!-- seabed debris & algae -->
  <path d="M8 58.5 Q7 54 9 50.5 Q10 48 9 45.5" fill="none" stroke="#6B8E23" stroke-width="1" stroke-linecap="round"/>
  <path d="M55.5 58.5 Q56.6 55 55.4 52" fill="none" stroke="#69F0AE" stroke-width="0.8" stroke-linecap="round"/>
  <g fill="#5A4B30" stroke="#0A0E1A" stroke-width="0.3">
    <ellipse cx="13" cy="58.6" rx="2" ry="1.1"/>
    <ellipse cx="51" cy="58.8" rx="1.6" ry="0.9"/>
  </g>

  <!-- floating particles drawn to the lure -->
  <g fill="#FFE57F">
    <circle cx="48.5" cy="31" r="0.4"/>
    <circle cx="50" cy="36.5" r="0.3"/>
    <circle cx="47" cy="40" r="0.3"/>
  </g>

  <!-- difficulty badge: medium, two stars -->
  <g>
    <rect x="14.5" y="2" width="35" height="21" rx="10.5" fill="#FFD740" fill-opacity="0.15"/>
    <rect x="16.5" y="3.5" width="31" height="18" rx="9" fill="#5C4700" stroke="#0A0E1A" stroke-width="0.6"/>
    <rect x="17.6" y="4.6" width="28.8" height="15.8" rx="7.9" fill="url(#mmBadge)" stroke="#FFF59D" stroke-width="0.5"/>
    <path d="M21 9 Q22 6.2 26 6 H38" fill="none" stroke="#FFFDE7" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.6"/>
    <g transform="translate(25 12.6)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mmStar)" stroke="#5C4700" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.35"/>
      <circle cx="-0.8" cy="-2" r="0.45" fill="#fff"/>
    </g>
    <g transform="translate(39 12.6)">
      <path d="M0 -5 L1.5 -1.6 L5.2 -1.2 L2.4 1.3 L3.2 4.9 L0 3 L-3.2 4.9 L-2.4 1.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="url(#mmStar)" stroke="#5C4700" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M0 -5 L0 0.3 L-5.2 -1.2 L-1.5 -1.6 Z" fill="#fff" fill-opacity="0.35"/>
      <circle cx="-0.8" cy="-2" r="0.45" fill="#fff"/>
    </g>
  </g>
</svg>
