<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pbSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A5A80"/>
      <stop offset="1" stop-color="#16294A"/>
    </linearGradient>
    <linearGradient id="pbDeck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#90A4AE"/>
      <stop offset="0.45" stop-color="#607D8B"/>
      <stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <radialGradient id="pbGlass" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#84FFFF"/>
      <stop offset="0.35" stop-color="#00B8D4"/>
      <stop offset="0.75" stop-color="#00838F"/>
      <stop offset="1" stop-color="#004D56"/>
    </radialGradient>
    <radialGradient id="pbInner" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#FFE57F" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#1DE9B6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1DE9B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbTank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0BEC5"/>
      <stop offset="0.5" stop-color="#546E7A"/>
      <stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="pbDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="0.5" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
    <radialGradient id="pbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow behind the colony -->
  <ellipse cx="32" cy="40" rx="28" ry="22" fill="url(#pbGlow)" fill-opacity="0.5"/>

  <!-- contact shadow + seabed mound -->
  <ellipse cx="32" cy="57.5" rx="28" ry="4.5" fill="#000" fill-opacity="0.38"/>
  <path d="M4 56 Q7 50.5 18 50 H46 Q57 50.5 60 56 Q57 60.5 32 61 Q7 60.5 4 56 Z" fill="url(#pbSand)" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.7"/>
  <path d="M8 54.5 Q12 51.5 22 51.2" fill="none" stroke="#7FA6CC" stroke-width="0.6" stroke-opacity="0.6" stroke-linecap="round"/>
  <g fill="#5C7EA6">
    <ellipse cx="9" cy="57" rx="1.6" ry="0.9"/>
    <ellipse cx="13.5" cy="58.8" rx="1" ry="0.6"/>
    <ellipse cx="52" cy="58.5" rx="1.4" ry="0.8"/>
    <ellipse cx="56.5" cy="56.6" rx="0.9" ry="0.55"/>
  </g>
  <g fill="#9EC3E6" fill-opacity="0.7">
    <circle cx="8.6" cy="56.7" r="0.4"/>
    <circle cx="51.6" cy="58.2" r="0.35"/>
  </g>
  <!-- tiny algae tufts -->
  <path d="M6.5 56 Q6 53.5 7.2 52 M7.5 56 Q8.2 54 7.8 52.6 M58 56 Q58.6 53.8 57.4 52.4" fill="none" stroke="#69F0AE" stroke-width="0.6" stroke-linecap="round"/>

  <!-- side tank left -->
  <g>
    <rect x="7" y="44" width="9" height="8" rx="2" fill="url(#pbTank)" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.7"/>
    <rect x="7.6" y="44.6" width="2.4" height="6.8" rx="1.2" fill="#fff" fill-opacity="0.3"/>
    <path d="M7 47 H16 M7 49.5 H16" stroke="#263238" stroke-width="0.35"/>
    <circle cx="12.5" cy="46" r="1.3" fill="#0A0E1A"/>
    <circle cx="12.5" cy="46" r="0.9" fill="#00E5FF"/>
    <circle cx="12.2" cy="45.7" r="0.3" fill="#E0F7FA"/>
    <path d="M16 47.5 H19" stroke="#78909C" stroke-width="1.4"/>
  </g>
  <!-- side tank right -->
  <g>
    <rect x="48" y="44" width="9" height="8" rx="2" fill="url(#pbTank)" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.7"/>
    <rect x="48.6" y="44.6" width="2" height="6.8" rx="1" fill="#fff" fill-opacity="0.22"/>
    <path d="M48 47 H57 M48 49.5 H57" stroke="#263238" stroke-width="0.35"/>
    <circle cx="52.5" cy="46" r="1.3" fill="#0A0E1A"/>
    <circle cx="52.5" cy="46" r="0.9" fill="#FFD740"/>
    <circle cx="52.2" cy="45.7" r="0.3" fill="#FFF8E1"/>
    <path d="M45 47.5 H48" stroke="#455A64" stroke-width="1.4"/>
    <path d="M57 50.5 Q57.6 48 56.6 45" fill="none" stroke="#1DE9B6" stroke-width="0.5" stroke-opacity="0.8"/>
  </g>

  <!-- deck ring -->
  <path d="M10 50 Q10 47 14 47 H50 Q54 47 54 50 V52 Q54 54 50 54 H14 Q10 54 10 52 Z" fill="url(#pbDeck)" stroke="#0A0E1A" stroke-width="0.6" stroke-opacity="0.8"/>
  <path d="M11 49.2 H53" stroke="#CFD8DC" stroke-width="0.5" stroke-opacity="0.7"/>
  <path d="M12 53.5 H52" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.6"/>
  <g fill="#37474F">
    <circle cx="14" cy="51.5" r="0.45"/>
    <circle cx="20" cy="51.5" r="0.45"/>
    <circle cx="44" cy="51.5" r="0.45"/>
    <circle cx="50" cy="51.5" r="0.45"/>
  </g>
  <g fill="#ECEFF1" fill-opacity="0.8">
    <circle cx="13.85" cy="51.35" r="0.18"/>
    <circle cx="19.85" cy="51.35" r="0.18"/>
    <circle cx="43.85" cy="51.35" r="0.18"/>
    <circle cx="49.85" cy="51.35" r="0.18"/>
  </g>
  <!-- deck running lights -->
  <g fill="#00E5FF">
    <circle cx="17" cy="51.5" r="1.2" fill-opacity="0.25"/>
    <circle cx="17" cy="51.5" r="0.5"/>
    <circle cx="47" cy="51.5" r="1.2" fill-opacity="0.25"/>
    <circle cx="47" cy="51.5" r="0.5"/>
  </g>

  <!-- glass dome -->
  <path d="M13 48 A19 19 0 0 1 51 48 Z" fill="url(#pbGlass)" stroke="#004D56" stroke-width="0.7"/>
  <path d="M13 48 A19 19 0 0 1 51 48 Z" fill="url(#pbInner)"/>
  <!-- interior habitat silhouettes -->
  <g fill="#004D56" fill-opacity="0.75">
    <path d="M18 48 V42 H22 V40 H25 V48 Z"/>
    <path d="M39 48 V39 H41 V37 H43 V39 H45 V48 Z"/>
  </g>
  <g fill="#FFE57F">
    <rect x="19" y="43" width="1" height="1"/>
    <rect x="23" y="41.5" width="1" height="1"/>
    <rect x="40.5" y="41" width="1" height="1"/>
    <rect x="43" y="43.5" width="1" height="1"/>
  </g>
  <!-- dome frame ribs -->
  <g fill="none" stroke="#006064" stroke-width="0.8" stroke-opacity="0.9">
    <path d="M32 29 V48"/>
    <path d="M32 29 Q22 33 21.5 48"/>
    <path d="M32 29 Q42 33 42.5 48"/>
    <path d="M16.5 39 Q32 35 47.5 39"/>
    <path d="M14 44 Q32 41 50 44"/>
  </g>
  <!-- rib joint bolts -->
  <g fill="#B2EBF2">
    <circle cx="32" cy="36.2" r="0.55"/>
    <circle cx="23.6" cy="37.4" r="0.5"/>
    <circle cx="40.4" cy="37.4" r="0.5"/>
    <circle cx="21.8" cy="42.7" r="0.5"/>
    <circle cx="42.2" cy="42.7" r="0.5"/>
    <circle cx="32" cy="41.6" r="0.55"/>
  </g>
  <!-- glass reflections -->
  <path d="M16.5 43 A16 16 0 0 1 27 31.5" fill="none" stroke="#E0F7FA" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M19.5 44 A13 13 0 0 1 22 39" fill="none" stroke="#E0F7FA" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.6"/>
  <circle cx="28.8" cy="31.2" r="0.8" fill="#fff"/>
  <!-- rim light on right edge -->
  <path d="M43 33 A18.5 18.5 0 0 1 50.4 46" fill="none" stroke="#00E5FF" stroke-width="0.9" stroke-linecap="round"/>
  <!-- shadow side -->
  <path d="M32 29 A19 19 0 0 1 51 48 H45 Q44 36 32 29 Z" fill="#00363D" fill-opacity="0.35"/>

  <!-- airlock -->
  <path d="M26.5 48 V45 Q26.5 41.5 32 41.5 Q37.5 41.5 37.5 45 V48 Z" fill="#263238" stroke="#0A0E1A" stroke-width="0.6"/>
  <path d="M28.2 48 V45.4 Q28.2 43.2 32 43.2 Q35.8 43.2 35.8 45.4 V48 Z" fill="url(#pbDoor)"/>
  <path d="M32 43.2 V48" stroke="#FF8F00" stroke-width="0.4"/>
  <ellipse cx="32" cy="49" rx="6" ry="1.1" fill="#FFD740" fill-opacity="0.35"/>
  <path d="M27 44.6 Q27.6 42.4 30.5 42" fill="none" stroke="#CFD8DC" stroke-width="0.4" stroke-opacity="0.8"/>

  <!-- antenna mast -->
  <path d="M32 29 V17" stroke="#37474F" stroke-width="2.2"/>
  <path d="M31.6 29 V17" stroke="#B0BEC5" stroke-width="0.7"/>
  <path d="M29 24 H35 M30 21 H34" stroke="#78909C" stroke-width="0.8" stroke-linecap="round"/>
  <rect x="30" y="27.4" width="4" height="2" rx="0.6" fill="#546E7A" stroke="#0A0E1A" stroke-width="0.35"/>
  <!-- beacon -->
  <circle cx="32" cy="14.5" r="6" fill="#00E5FF" fill-opacity="0.15"/>
  <circle cx="32" cy="14.5" r="4" fill="#00E5FF" fill-opacity="0.25"/>
  <circle cx="32" cy="14.5" r="2.6" fill="#00E5FF" stroke="#006064" stroke-width="0.4"/>
  <circle cx="32" cy="14.5" r="1.3" fill="#E0F7FA"/>
  <circle cx="31.2" cy="13.7" r="0.45" fill="#fff"/>

  <!-- rising bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#B2EBF2" stroke-width="0.35" stroke-opacity="0.8">
    <circle cx="47" cy="27" r="1.3"/>
    <circle cx="49.5" cy="22" r="0.9"/>
    <circle cx="47.8" cy="18" r="0.6"/>
    <circle cx="15" cy="31" r="0.8"/>
  </g>
  <g fill="#fff">
    <circle cx="46.6" cy="26.6" r="0.35"/>
    <circle cx="49.2" cy="21.7" r="0.25"/>
  </g>
</svg>
