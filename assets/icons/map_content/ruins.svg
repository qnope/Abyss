<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ruSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A5A80"/>
      <stop offset="1" stop-color="#16294A"/>
    </linearGradient>
    <linearGradient id="ruCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0BEC5"/>
      <stop offset="0.45" stop-color="#78909C"/>
      <stop offset="1" stop-color="#37474F"/>
    </linearGradient>
    <linearGradient id="ruCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFD8DC"/>
      <stop offset="1" stop-color="#607D8B"/>
    </linearGradient>
    <linearGradient id="ruStep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78909C"/>
      <stop offset="1" stop-color="#37474F"/>
    </linearGradient>
    <linearGradient id="ruDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0BEC5"/>
      <stop offset="0.5" stop-color="#78909C"/>
      <stop offset="1" stop-color="#37474F"/>
    </linearGradient>
    <radialGradient id="ruGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B388FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#B388FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruKelp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1B6B4F"/>
      <stop offset="1" stop-color="#69F0AE"/>
    </linearGradient>
  </defs>

  <!-- mystic glow -->
  <ellipse cx="32" cy="36" rx="14" ry="12" fill="url(#ruGlow)" fill-opacity="0.45"/>

  <!-- contact shadow + seabed -->
  <ellipse cx="32" cy="58" rx="29" ry="4.2" fill="#000" fill-opacity="0.38"/>
  <path d="M3 57.5 Q6 52.5 16 52 H48 Q58 52.5 61 57.5 Q58 61.2 32 61.6 Q6 61.2 3 57.5 Z" fill="url(#ruSand)" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.7"/>

  <!-- stylobate steps -->
  <path d="M6 54 H58 L57 57.6 H7 Z" fill="url(#ruStep)" stroke="#1C262B" stroke-width="0.5"/>
  <path d="M6 54 H58 V54.8 H6 Z" fill="#B0BEC5" fill-opacity="0.6"/>
  <path d="M9 51.4 H55 V54 H9 Z" fill="url(#ruStep)" stroke="#1C262B" stroke-width="0.5"/>
  <path d="M9 51.4 H55 V52.1 H9 Z" fill="#CFD8DC" fill-opacity="0.6"/>
  <path d="M20 51.4 V54 M33 51.4 V54 M44 51.4 V54 M14 54 V57.6 M27 54 V57.6 M40 54 V57.6 M51 54 V57.6" stroke="#263238" stroke-width="0.35" stroke-opacity="0.7"/>
  <path d="M36 54 L37.4 55.6 L36.8 57.6" fill="none" stroke="#1C262B" stroke-width="0.4"/>

  <!-- left column (broken top) -->
  <g>
    <path d="M10.5 51.4 V24 L12.6 22 L14.2 23.6 L16 21.4 L18.5 23.4 V51.4 Z" fill="url(#ruCol)" stroke="#1C262B" stroke-width="0.55"/>
    <g stroke="#37474F" stroke-width="0.35" stroke-opacity="0.75">
      <path d="M12.5 24 V51"/>
      <path d="M14.5 24 V51"/>
      <path d="M16.5 23.6 V51"/>
    </g>
    <path d="M11.2 25 V50.6" stroke="#ECEFF1" stroke-width="0.5" stroke-opacity="0.6"/>
    <path d="M10 49.6 H19 V51.4 H10 Z" fill="url(#ruCap)" stroke="#1C262B" stroke-width="0.4"/>
    <path d="M17 31 L15.4 34 L16.4 36.4" fill="none" stroke="#1C262B" stroke-width="0.4"/>
  </g>
  <!-- left capital, tumbled and tilted -->
  <g transform="translate(0 1.6) rotate(-8 14 19)">
    <path d="M8 17.4 H20.4 V20.2 H8 Z" fill="url(#ruCap)" stroke="#1C262B" stroke-width="0.5"/>
    <path d="M9.2 20.2 H19.2 L18.2 21.6 H10.2 Z" fill="#78909C" stroke="#1C262B" stroke-width="0.4"/>
    <circle cx="9" cy="18.8" r="1" fill="#90A4AE" stroke="#1C262B" stroke-width="0.35"/>
    <circle cx="19.4" cy="18.8" r="1" fill="#607D8B" stroke="#1C262B" stroke-width="0.35"/>
    <path d="M9 17.9 H17" stroke="#fff" stroke-width="0.4" stroke-opacity="0.7"/>
  </g>

  <!-- right column (tall, intact capital) -->
  <g>
    <path d="M45 51.4 V15.4 H55 V51.4 Z" fill="url(#ruCol)" stroke="#1C262B" stroke-width="0.55"/>
    <g stroke="#37474F" stroke-width="0.35" stroke-opacity="0.75">
      <path d="M47.5 15.6 V51"/>
      <path d="M50 15.6 V51"/>
      <path d="M52.5 15.6 V51"/>
    </g>
    <path d="M45.8 16.4 V50.6" stroke="#ECEFF1" stroke-width="0.5" stroke-opacity="0.6"/>
    <path d="M55 22 V51.4" stroke="#1DE9B6" stroke-width="0.5" stroke-opacity="0.6"/>
    <path d="M44.4 49.6 H55.6 V51.4 H44.4 Z" fill="url(#ruCap)" stroke="#1C262B" stroke-width="0.4"/>
    <!-- capital -->
    <path d="M43.6 13 H56.4 L55.4 15.4 H44.6 Z" fill="#78909C" stroke="#1C262B" stroke-width="0.45"/>
    <path d="M42 9.4 H58 V13 H42 Z" fill="url(#ruCap)" stroke="#1C262B" stroke-width="0.55"/>
    <circle cx="43" cy="12.4" r="1.3" fill="#90A4AE" stroke="#1C262B" stroke-width="0.4"/>
    <circle cx="57" cy="12.4" r="1.3" fill="#546E7A" stroke="#1C262B" stroke-width="0.4"/>
    <circle cx="43" cy="12.4" r="0.45" fill="#37474F"/>
    <circle cx="57" cy="12.4" r="0.45" fill="#263238"/>
    <path d="M42.8 10.2 H54" stroke="#fff" stroke-width="0.45" stroke-opacity="0.75"/>
    <!-- broken lintel stub -->
    <path d="M42 9.4 L38.6 9.4 L39.6 7.4 L38.2 6.2 H45 V9.4 Z" fill="#90A4AE" stroke="#1C262B" stroke-width="0.45"/>
    <path d="M38.2 6.2 H58 V9.4 H45" fill="none" stroke="#1C262B" stroke-width="0.45"/>
    <path d="M45 6.2 H58 V9.4 H45 Z" fill="url(#ruCap)" stroke="#1C262B" stroke-width="0.45"/>
    <path d="M39 6.9 H57" stroke="#fff" stroke-width="0.4" stroke-opacity="0.6"/>
    <path d="M51 20 L52.6 23 L51.4 25.6 L52.8 28" fill="none" stroke="#1C262B" stroke-width="0.4"/>
  </g>

  <!-- middle broken column stump with runes -->
  <g>
    <path d="M27 51.4 V36.6 L29 34.4 L30.6 36 L32.6 32.8 L34.4 35.4 L36 34.6 V51.4 Z" fill="url(#ruCol)" stroke="#1C262B" stroke-width="0.55"/>
    <g stroke="#37474F" stroke-width="0.35" stroke-opacity="0.75">
      <path d="M29.2 36.4 V51"/>
      <path d="M31.5 35 V51"/>
      <path d="M33.8 35.4 V51"/>
    </g>
    <path d="M27.7 37.4 V50.6" stroke="#ECEFF1" stroke-width="0.5" stroke-opacity="0.6"/>
    <path d="M26.4 49.6 H36.6 V51.4 H26.4 Z" fill="url(#ruCap)" stroke="#1C262B" stroke-width="0.4"/>
    <!-- glowing runes -->
    <circle cx="31.5" cy="43" r="4" fill="#B388FF" fill-opacity="0.2"/>
    <g fill="none" stroke="#E1CCFF" stroke-width="0.6" stroke-linecap="round">
      <path d="M30 40.4 L31.5 39 L33 40.4 L31.5 41.8 Z"/>
      <path d="M31.5 42.6 V46"/>
      <path d="M30 44.4 H33"/>
    </g>
  </g>

  <!-- fallen column drum -->
  <g>
    <path d="M37 47 H44 V51.4 H37 Z" fill="url(#ruDrum)" stroke="#1C262B" stroke-width="0.45"/>
    <path d="M37 48.5 H44 M37 50 H44" stroke="#37474F" stroke-width="0.3" stroke-opacity="0.7"/>
    <ellipse cx="37" cy="49.2" rx="1.2" ry="2.2" fill="#90A4AE" stroke="#1C262B" stroke-width="0.4"/>
    <ellipse cx="37" cy="49.2" rx="0.5" ry="1" fill="#607D8B"/>
  </g>
  <!-- broken block on the steps -->
  <path d="M20.4 51.4 L21.4 47.8 L25.2 47.2 L26 51.4 Z" fill="#78909C" stroke="#1C262B" stroke-width="0.45"/>
  <path d="M21.4 47.8 L25.2 47.2 L24.6 48.4 L21.8 48.8 Z" fill="#CFD8DC" fill-opacity="0.7"/>

  <!-- moss patches -->
  <g fill="#2A8C6A" fill-opacity="0.85">
    <path d="M10.5 46 Q12.5 44.6 14 46.4 Q12.5 48 10.5 47.6 Z"/>
    <path d="M45 34 Q47 32.4 49 34.2 Q47 35.6 45 35.2 Z"/>
    <path d="M27 47.4 Q29 46.4 30.2 47.8 Q28.4 49 27 48.6 Z"/>
    <path d="M42 9.4 Q44 8.2 46 9.4 Q44 10.4 42 10.2 Z"/>
  </g>
  <!-- climbing algae vines -->
  <g fill="none" stroke-linecap="round">
    <path d="M18.5 50 Q16 45 18 40 Q19.6 36 17 31.4 Q15.6 29 16.6 26" stroke="#69F0AE" stroke-width="0.9"/>
    <path d="M45 50.6 Q47.6 44 45.6 38.6 Q44.2 34 46.8 28.6 Q48 25.6 46.4 22" stroke="#69F0AE" stroke-width="0.9"/>
    <path d="M55.4 13.4 Q54 18 55.8 21.6" stroke="#1DE9B6" stroke-width="0.7"/>
  </g>
  <g fill="#69F0AE">
    <ellipse cx="17.6" cy="38.4" rx="1.1" ry="0.5" transform="rotate(-30 17.6 38.4)"/>
    <ellipse cx="16.8" cy="30" rx="1" ry="0.45" transform="rotate(25 16.8 30)"/>
    <ellipse cx="46.6" cy="41" rx="1.1" ry="0.5" transform="rotate(30 46.6 41)"/>
    <ellipse cx="45.4" cy="33" rx="1" ry="0.45" transform="rotate(-25 45.4 33)"/>
    <ellipse cx="47.2" cy="26" rx="0.9" ry="0.4" transform="rotate(20 47.2 26)"/>
  </g>
  <!-- kelp at the base -->
  <path d="M5.6 57 Q4 51 6.4 46 Q8 42.6 6.4 38.6 Q8.4 42.6 7.8 46.4 Q6.6 51 7.6 57 Z" fill="url(#ruKelp)" stroke="#0B3A27" stroke-width="0.35"/>
  <path d="M58.4 57 Q60.2 52 58.2 47.4 Q60.6 50.6 60 57 Z" fill="url(#ruKelp)" stroke="#0B3A27" stroke-width="0.35"/>
  <path d="M23 51.4 Q22.4 49 23.4 47.2 M40.8 47 Q41.6 45 40.8 43.4" fill="none" stroke="#2A8C6A" stroke-width="0.8" stroke-linecap="round"/>

  <!-- coral sprig & shell -->
  <path d="M10.2 54 Q10 51.6 11 50.4 M10.6 52.2 Q11.8 51.6 12.2 50.6" fill="none" stroke="#FF6E91" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M51.6 57.8 Q52.8 55.8 54.4 57.8 Z" fill="#FF80AB" stroke="#8E2436" stroke-width="0.3"/>

  <!-- floating spirit lights -->
  <g fill="#B388FF">
    <circle cx="24" cy="20" r="2.4" fill-opacity="0.2"/>
    <circle cx="24" cy="20" r="1"/>
    <circle cx="36.5" cy="25" r="1.8" fill-opacity="0.2"/>
    <circle cx="36.5" cy="25" r="0.7"/>
    <circle cx="30" cy="14" r="0.5"/>
  </g>
  <g fill="#fff">
    <circle cx="23.7" cy="19.7" r="0.35"/>
    <circle cx="36.3" cy="24.8" r="0.25"/>
  </g>
  <!-- bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#B2EBF2" stroke-width="0.35" stroke-opacity="0.8">
    <circle cx="33.5" cy="30" r="0.9"/>
    <circle cx="34.6" cy="27.4" r="0.55"/>
  </g>
</svg>
