<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ex1Glow" cx="45" cy="17" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#00B8D4" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#448AFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#448AFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ex1Halo" cx="45" cy="17" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F7FA" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ex1Bulb" cx="45" cy="17" r="5" fx="43.6" fy="15.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#E0F7FA"/>
      <stop offset="0.7" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0091EA"/>
    </radialGradient>
    <linearGradient id="ex1Body" x1="18" y1="32" x2="28" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A5A9E"/>
      <stop offset="0.45" stop-color="#143A75"/>
      <stop offset="1" stop-color="#071A3E"/>
    </linearGradient>
    <linearGradient id="ex1Beam" x1="45" y1="17" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ex1Fin" x1="14" y1="46" x2="22" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#448AFF"/>
      <stop offset="1" stop-color="#0D2A66"/>
    </linearGradient>
    <radialGradient id="ex1Eye" cx="29" cy="41" r="3" fx="28.2" fy="40.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F7FA"/>
      <stop offset="0.6" stop-color="#80DEEA"/>
      <stop offset="1" stop-color="#00838F"/>
    </radialGradient>
  </defs>

  <!-- revealed darkness -->
  <circle cx="45" cy="17" r="19" fill="url(#ex1Glow)"/>
  <circle cx="32" cy="34" r="30" fill="#00E5FF" fill-opacity="0.04"/>
  <circle cx="45" cy="17" r="15.5" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.35" stroke-dasharray="1.5 2.2"/>
    <!-- light beams -->
  <path d="M45 17 L61 38 L55 46 Z" fill="url(#ex1Beam)"/>
  
  <g stroke="#E0F7FA" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M45 6 V3" stroke-width="0.9"/>
    <path d="M53 9 L55.4 6.6" stroke-width="0.9"/>
    <path d="M56 17 H59.4" stroke-width="0.9"/>
    <path d="M37 9 L34.6 6.6" stroke-width="0.9"/>
    <path d="M53 25 L55.4 27.4" stroke-width="0.9"/>
  </g>

  <!-- anglerfish body -->
  <g>
    <path d="M1 63 Q-1 47 9 40 Q19 32.6 31 35.4 Q41 37.8 47 45.4 L37 48.6 L45 52.6 Q41 60.4 30 63 Z" fill="url(#ex1Body)" stroke="#06183A" stroke-width="0.7" stroke-linejoin="round"/>
    <!-- rim light toward the lure -->
    <path d="M10 40 Q19 33.6 30.6 36.2 Q40 38.4 45.6 45" fill="none" stroke="#00E5FF" stroke-width="0.9" stroke-opacity="0.75" stroke-linecap="round"/>
    <path d="M14 37.8 Q22 34.6 29 35.8" fill="none" stroke="#E0F7FA" stroke-width="0.6" stroke-opacity="0.7" stroke-linecap="round"/>
    <!-- mouth -->
    <path d="M47 45.4 L37 48.6 L45 52.6 Q46.6 49 47 45.4 Z" fill="#0A0E1A"/>
    <path d="M40 48.2 Q42 49.6 44.6 50.6" fill="none" stroke="#B388FF" stroke-width="0.5" stroke-opacity="0.5"/>
    <g fill="#E0F7FA" stroke="#06183A" stroke-width="0.2">
      <path d="M45.6 45.8 L45.4 48.4 L44.4 46.2 Z"/>
      <path d="M43 46.6 L42.4 49.2 L41.6 47 Z"/>
      <path d="M40.4 47.4 L39.8 49.4 L39 47.8 Z"/>
      <path d="M44.4 52.2 L44 49.8 L43.2 51.8 Z"/>
      <path d="M41.8 51 L41.6 48.8 L40.6 50.4 Z"/>
    </g>
    <!-- gill & mouth crease -->
    <path d="M22 44 Q19 50 22 57" fill="none" stroke="#06183A" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M22.8 44.4 Q20.2 50 22.8 56" fill="none" stroke="#448AFF" stroke-width="0.4" stroke-opacity="0.6"/>
    <path d="M37 48.6 Q33 50 30 49" fill="none" stroke="#06183A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- pectoral fin -->
    <path d="M18 52 Q11 50 8 56 Q13 55 12 61 Q17 58 18 52 Z" fill="url(#ex1Fin)" stroke="#06183A" stroke-width="0.5"/>
    <path d="M17 52.6 L10 56 M17 53.4 L13 59" stroke="#82B1FF" stroke-width="0.35" stroke-opacity="0.7"/>
    <!-- dorsal spines -->
    <path d="M8 41 L5 35.6 L11 39 M12 38.4 L10.6 32.6 L15 36.6" fill="#143A75" stroke="#06183A" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- eye -->
    <circle cx="29" cy="41" r="3" fill="#0A0E1A"/>
    <circle cx="29" cy="41" r="2.3" fill="url(#ex1Eye)"/>
    <circle cx="29.4" cy="41.3" r="1" fill="#0A0E1A"/>
    <circle cx="28.3" cy="40.2" r="0.5" fill="#FFFFFF"/>
    <!-- photophores -->
    <g fill="#00E5FF">
      <circle cx="8" cy="50" r="1.3" fill-opacity="0.2"/>
      <circle cx="8" cy="50" r="0.45"/>
      <circle cx="13" cy="45.4" r="1.2" fill-opacity="0.2"/>
      <circle cx="13" cy="45.4" r="0.4"/>
      <circle cx="26" cy="58" r="1.2" fill-opacity="0.2"/>
      <circle cx="26" cy="58" r="0.4"/>
      <circle cx="32" cy="55" r="1" fill-opacity="0.2"/>
      <circle cx="32" cy="55" r="0.35"/>
    </g>
  </g>

  <!-- illicium stalk -->
  <path d="M26.4 35.4 Q23 22 32 13.6 Q39 7.6 43.4 13" fill="none" stroke="#06183A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M26.4 35.4 Q23 22 32 13.6 Q39 7.6 43.4 13" fill="none" stroke="#2A5A9E" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M25.6 30 Q24.8 21 31.4 14.6 Q37 9.6 41.4 11.4" fill="none" stroke="#00E5FF" stroke-width="0.45" stroke-opacity="0.85" stroke-linecap="round"/>

  <!-- lure lantern -->
  <circle cx="45" cy="17" r="11" fill="url(#ex1Halo)"/>
  <path d="M42.6 12.6 Q45 11.4 47 13" fill="none" stroke="#06183A" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="45" cy="17" r="5" fill="url(#ex1Bulb)" stroke="#006C80" stroke-width="0.5"/>
  <path d="M41.2 16 Q42 13.2 45 12.6" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.9" stroke-linecap="round"/>
  <path d="M48.6 18.6 Q47.6 21.2 45 21.6" fill="none" stroke="#B388FF" stroke-width="0.6" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="43.4" cy="15.4" r="1.2" fill="#FFFFFF"/>
  <!-- lure filaments -->
  <path d="M46 22 Q47 25 45.6 27.6 M44 22 Q42.6 24.6 43.4 27" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <circle cx="45.6" cy="27.8" r="0.6" fill="#E0F7FA"/>
  <circle cx="43.4" cy="27.2" r="0.5" fill="#E0F7FA"/>

  <!-- plankton lit by the lure -->
  <g fill="#00E5FF">
    <circle cx="57" cy="30" r="1.4" fill-opacity="0.2"/>
    <circle cx="57" cy="30" r="0.5"/>
    <circle cx="36" cy="27" r="1.2" fill-opacity="0.2"/>
    <circle cx="36" cy="27" r="0.4"/>
    <circle cx="58" cy="44" r="0.45" fill-opacity="0.8"/>
  </g>
  <g fill="#B388FF">
    <circle cx="6" cy="10" r="1.3" fill-opacity="0.18"/>
    <circle cx="6" cy="10" r="0.45"/>
    <circle cx="16" cy="20" r="0.4" fill-opacity="0.7"/>
  </g>
  <!-- bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.4" stroke-opacity="0.7">
    <circle cx="52" cy="40" r="1.5"/>
    <circle cx="55" cy="35" r="0.9"/>
    <circle cx="50.4" cy="45" r="0.7"/>
  </g>
  <circle cx="51.5" cy="39.5" r="0.4" fill="#FFFFFF"/>
</svg>
