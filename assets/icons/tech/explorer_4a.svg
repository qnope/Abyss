    <path d="M60 0 Q56 14 49.6 24.4" fill="none" stroke="#C8A97E" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.2 0.5"/>
    <circle cx="49.4" cy="25" r="1.3" fill="none" stroke="#06183A" stroke-width="1.6"/>
    <circle cx="49.4" cy="25" r="1.3" fill="none" stroke="#B0BEC5" stroke-width="0.8"/>
    <path d="M48.8 26.4 L46.4 37" stroke="#06183A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M48.8 26.4 L46.4 37" stroke="url(#ex4aHook)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M46.4 37 Q41.4 38.6 41.6 33.8 M46.4 37 Q51.4 39.6 52.8 35 M46.4 37 Q46 41 43.6 40.4" fill="none" stroke="#06183A" stroke-width="2" stroke-linecap="round"/>
