  <!-- plankton & bubbles -->
  <g fill="#00E5FF">
    <circle cx="5" cy="8" r="1.4" fill-opacity="0.15"/>
    <circle cx="5" cy="8" r="0.45"/>
    <circle cx="12" cy="16" r="0.4" fill-opacity="0.7"/>
  </g>
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.4" stroke-opacity="0.7">
    <circle cx="37" cy="36" r="1.2"/>
    <circle cx="38.6" cy="32.6" r="0.8"/>
    <circle cx="36.4" cy="29.4" r="0.6"/>
