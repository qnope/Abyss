    <g fill="#FFFFFF">
      <path d="M40 49.4 L40.4 50.6 L41.6 51 L40.4 51.4 L40 52.6 L39.6 51.4 L38.4 51 L39.6 50.6 Z"/>
      <path d="M45 52.4 L45.25 53.2 L46 53.4 L45.25 53.6 L45 54.4 L44.75 53.6 L44 53.4 L44.75 53.2 Z"/>
      <path d="M33 53.6 L33.25 54.3 L34 54.5 L33.25 54.7 L33 55.4 L32.75 54.7 L32 54.5 L32.75 54.3 Z"/>
