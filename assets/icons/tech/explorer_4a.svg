      <ellipse cx="37.6" cy="50" rx="1.5" ry="0.75"/>
      <ellipse cx="43.4" cy="55.4" rx="1.6" ry="0.8"/>
      <ellipse cx="32" cy="56.4" rx="1.5" ry="0.75"/>
      <ellipse cx="49" cy="57" rx="1.4" ry="0.7"/>
