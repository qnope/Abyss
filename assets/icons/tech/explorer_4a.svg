    <path d="M5.4 26.2 Q22 32.6 55.6 38.4" fill="none" stroke="#8FB0DA" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M7 27.6 Q20 32 32 34.4" fill="none" stroke="#E0F7FA" stroke-width="0.4" stroke-opacity="0.8"/>
    <path d="M53.4 43 Q48 52 36 53.6" fill="none" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.7" stroke-linecap="round"/>
