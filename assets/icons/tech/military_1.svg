    <path d="M23.2 9 L24.4 8.3 M41 9 L39.6 8.3" stroke="#FFFFFF" stroke-width="0.35"/>
  </g>

  <!-- plankton -->
  <g fill="#FF80AB">
    <circle cx="6" cy="10" r="1.4" fill-opacity="0.15"/><circle cx="6" cy="10" r="0.45"/>
    <circle cx="58" cy="44" r="1.4" fill-opacity="0.15"/><circle cx="58" cy="44" r="0.45"/>
    <circle cx="7" cy="48" r="1.4" fill-opacity="0.15"/><circle cx="7" cy="48" r="0.45"/>
    <circle cx="57" cy="14" r="1.2" fill-opacity="0.15"/><circle cx="57" cy="14" r="0.4"/>
  </g>
  <!-- bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.4" stroke-opacity="0.7">
    <circle cx="44" cy="48" r="1.6"/><circle cx="48" cy="54" r="1"/><circle cx="20" cy="50" r="1.1"/><circle cx="17" cy="56" r="0.7"/>
