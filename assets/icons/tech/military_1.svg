    <radialGradient id="mi1Gem" cx="32" cy="32.5" r="3" fx="31" fy="31.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#84FFFF"/>
      <stop offset="1" stop-color="#00838F"/>
    </radialGradient>
  </defs>

  <!-- background glow -->
  <circle cx="32" cy="28" r="29" fill="url(#mi1Glow)"/>

  <!-- shaft -->
  <g>
    <rect x="29.6" y="33" width="4.8" height="29" rx="1.6" fill="url(#mi1Shaft)" stroke="#0A0E1A" stroke-width="0.6"/>
    <path d="M30.6 35 V60" stroke="#FFB3CF" stroke-width="0.6" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M33.8 36 V60" stroke="#FF4081" stroke-width="0.4" stroke-opacity="0.6"/>
    <!-- grip wraps -->
    <g fill="#AD1457" stroke="#0A0E1A" stroke-width="0.4">
      <path d="M29.2 44 L34.8 42.4 V44.6 L29.2 46.2 Z"/>
      <path d="M29.2 48 L34.8 46.4 V48.6 L29.2 50.2 Z"/>
      <path d="M29.2 52 L34.8 50.4 V52.6 L29.2 54.2 Z"/>
    </g>
    <path d="M29.8 44.6 L34.2 43.3 M29.8 48.6 L34.2 47.3 M29.8 52.6 L34.2 51.3" stroke="#FFC1D9" stroke-width="0.4" stroke-opacity="0.8"/>
    <rect x="28.8" y="58.6" width="6.4" height="3.4" rx="1.2" fill="url(#mi1Steel)" stroke="#0A0E1A" stroke-width="0.5"/>
    <circle cx="32" cy="60.3" r="0.6" fill="#FF80AB"/>
  </g>

  <!-- side prongs -->
  <g stroke="#06183A" stroke-width="0.6" stroke-linejoin="round">
    <path d="M15.6 29 V15.4 L13.4 16.6 L17.4 3.6 L21.4 16.6 L19.2 15.4 V29 Z" fill="url(#mi1Prong)"/>
    <path d="M48.4 29 V15.4 L50.6 16.6 L46.6 3.6 L42.6 16.6 L44.8 15.4 V29 Z" fill="url(#mi1Prong)"/>
    <path d="M28.8 30 V13 L26.2 14.4 L32 2 L37.8 14.4 L35.2 13 V30 Z" fill="url(#mi1Prong)"/>
  </g>
  <!-- edge highlights + fullers -->
  <g fill="none" stroke-linecap="round">
    <path d="M17.4 5 L14.8 15.6 M32 3.4 L28 13.6 M46.6 5 L43.9 15.6" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.9"/>
