<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="mi1Glow" cx="32" cy="24" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF80AB" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#C2185B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#880E4F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mi1Steel" x1="14" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#CFD8DC"/>
      <stop offset="0.65" stop-color="#78909C"/>
      <stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="mi1Prong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.45" stop-color="#B0BEC5"/>
      <stop offset="1" stop-color="#37474F"/>
    </linearGradient>
    <linearGradient id="mi1Coral" x1="18" y1="22" x2="46" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC1D9"/>
      <stop offset="0.35" stop-color="#FF80AB"/>
      <stop offset="0.7" stop-color="#D81B60"/>
      <stop offset="1" stop-color="#6A0F3A"/>
    </linearGradient>
    <linearGradient id="mi1Shaft" x1="29" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E3A5E"/>
      <stop offset="0.4" stop-color="#5C1838"/>
      <stop offset="1" stop-color="#22071A"/>
