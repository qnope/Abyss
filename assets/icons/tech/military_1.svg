      <circle cx="39" cy="34.6" r="0.5"/><circle cx="43.4" cy="34.2" r="0.5"/><circle cx="47" cy="32" r="0.5"/>
    </g>
    <g fill="#6A0F3A">
      <circle cx="17" cy="32.2" r="0.22"/><circle cx="20.6" cy="34.2" r="0.2"/><circle cx="25" cy="34.6" r="0.2"/>
      <circle cx="39" cy="34.6" r="0.2"/><circle cx="43.4" cy="34.2" r="0.2"/><circle cx="47" cy="32" r="0.2"/>
    </g>
    <!-- coral branches -->
    <path d="M13.4 30 Q10.4 29 9.6 26 M12.8 33 Q9.6 34 8.4 31.6 M50.6 30 Q53.6 29 54.4 26 M51.2 33 Q54.4 34 55.6 31.6" fill="none" stroke="#FF80AB" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M13.4 30 Q10.4 29 9.6 26 M50.6 30 Q53.6 29 54.4 26" fill="none" stroke="#FFE0EC" stroke-width="0.4" stroke-opacity="0.7" stroke-linecap="round"/>
    <circle cx="9.6" cy="25.8" r="0.9" fill="#FFC1D9"/><circle cx="8.4" cy="31.4" r="0.8" fill="#FF80AB"/>
    <circle cx="54.4" cy="25.8" r="0.9" fill="#FFC1D9"/><circle cx="55.6" cy="31.4" r="0.8" fill="#FF80AB"/>
  </g>

  <!-- central socket + gem -->
  <g>
    <path d="M26.6 30 H37.4 L36 37.6 Q32 39.4 28 37.6 Z" fill="url(#mi1Steel)" stroke="#06183A" stroke-width="0.6" stroke-linejoin="round"/>
    <circle cx="32" cy="32.6" r="4.2" fill="#00E5FF" fill-opacity="0.2"/>
    <circle cx="32" cy="32.6" r="2.6" fill="url(#mi1Gem)" stroke="#06183A" stroke-width="0.5"/>
    <circle cx="31.2" cy="31.7" r="0.6" fill="#FFFFFF"/>
    <path d="M27.6 31 H36.4" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.6"/>
  </g>

  <!-- glints on tips -->
  <g>
    <circle cx="32" cy="3.5" r="4.4" fill="#FF80AB" fill-opacity="0.18"/>
    <circle cx="17.4" cy="4.8" r="3.4" fill="#FF80AB" fill-opacity="0.16"/>
    <circle cx="46.6" cy="4.8" r="3.4" fill="#84FFFF" fill-opacity="0.16"/>
    <path d="M32 -0.4 L32.7 2.8 L35.9 3.5 L32.7 4.2 L32 7.4 L31.3 4.2 L28.1 3.5 L31.3 2.8 Z" fill="#FFFFFF"/>
    <path d="M17.4 1.8 L17.9 4.4 L20.4 4.9 L17.9 5.4 L17.4 8 L16.9 5.4 L14.4 4.9 L16.9 4.4 Z" fill="#FFE0EC"/>
    <path d="M46.6 1.8 L47.1 4.4 L49.6 4.9 L47.1 5.4 L46.6 8 L46.1 5.4 L43.6 4.9 L46.1 4.4 Z" fill="#E0F7FA"/>
