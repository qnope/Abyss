<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="mi4bGlow" cx="34" cy="34" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF80AB" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#C2185B" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#880E4F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mi4bRock" x1="34" y1="10" x2="60" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A4B7A"/>
      <stop offset="0.45" stop-color="#2E2547"/>
      <stop offset="1" stop-color="#0E0A1C"/>
    </linearGradient>
    <radialGradient id="mi4bMaw" cx="47" cy="38" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A0B30"/>
      <stop offset="0.55" stop-color="#1A0612"/>
      <stop offset="1" stop-color="#05020A"/>
