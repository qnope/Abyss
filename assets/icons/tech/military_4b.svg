      <path d="M-38 -6 H-24 M-46 6 H-26 M-48 11 H-32 M-32 -11 H-22" stroke="#FF80AB" stroke-width="1.6" stroke-opacity="0.55"/>
      <path d="M-37 -6 H-30 M-45 6 H-36 M-31 -11 H-27" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.8"/>
      <path d="M-46 11 H-38 M-28 -6 H-25" stroke="#84FFFF" stroke-width="0.7" stroke-opacity="0.7"/>
    </g>
    <path d="M-42 0 H-9" stroke="#0A0E1A" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M-42 0 H-9" stroke="url(#mi4bShaft)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-40 -0.5 H-10" stroke="#FFC1D9" stroke-width="0.5" stroke-opacity="0.75" stroke-linecap="round"/>
    <path d="M-38 0 L-43 -4.2 L-41.4 0 L-43 4.2 Z M-34 0 L-39 -4.2 L-37.4 0 L-39 4.2 Z" fill="#FF80AB" stroke="#3B0A22" stroke-width="0.45" stroke-linejoin="round"/>
    <path d="M-15 -1.6 V1.6 M-12.6 -1.6 V1.6" stroke="#ECEFF1" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M0.6 0 L-6 -2.6 L-10.4 -5 L-8.6 -1.3 L-11 -1.3 V1.3 L-8.6 1.3 L-10.4 5 L-6 2.6 Z" fill="url(#mi4bHead)" stroke="#06183A" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M-0.6 -0.5 L-6.4 -2.4 L-9 -3.8" fill="none" stroke="#FFFFFF" stroke-width="0.55" stroke-linecap="round"/>
    <path d="M-1.4 0 H-8" stroke="#455A64" stroke-width="0.4"/>
  </g>

  <!-- impact flare at tip -->
  <g>
    <circle cx="40" cy="32" r="9" fill="url(#mi4bImpact)" transform="translate(-0.4 5.6)"/>
    <path d="M39.6 32.4 L40.4 36.8 L44.8 37.6 L40.4 38.4 L39.6 42.8 L38.8 38.4 L34.4 37.6 L38.8 36.8 Z" fill="#FFFFFF"/>
    <path d="M43.2 34 L41.6 35.6 M43.2 41.2 L41.6 39.6" stroke="#FFE0EC" stroke-width="0.5" stroke-linecap="round"/>
  </g>

  <!-- plankton -->
  <g fill="#FF80AB">
    <circle cx="8" cy="10" r="1.4" fill-opacity="0.15"/><circle cx="8" cy="10" r="0.45"/>
    <circle cx="24" cy="6" r="1.2" fill-opacity="0.15"/><circle cx="24" cy="6" r="0.4"/>
    <circle cx="4" cy="24" r="1.2" fill-opacity="0.15"/><circle cx="4" cy="24" r="0.4"/>
  </g>
  <!-- bubbles -->
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.4" stroke-opacity="0.7">
    <circle cx="18" cy="22" r="1.5"/><circle cx="14" cy="17" r="0.9"/><circle cx="20" cy="14" r="0.7"/>
  </g>
  <circle cx="17.5" cy="21.5" r="0.42" fill="#FFFFFF"/>
</svg>
