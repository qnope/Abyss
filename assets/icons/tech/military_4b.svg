      <stop offset="1" stop-color="#FF80AB"/>
    </linearGradient>
    <linearGradient id="mi4bHead" x1="-10" y1="-5" x2="0" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#CFD8DC"/>
      <stop offset="1" stop-color="#37474F"/>
    </linearGradient>
    <radialGradient id="mi4bImpact" cx="40" cy="32" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#FF80AB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF80AB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="34" cy="34" r="29" fill="url(#mi4bGlow)"/>

  <!-- lair rock -->
  <g>
    <path d="M30 60 Q31 46 34 38 Q35 28 40 22 Q42 14 48 12 Q53 10 56 15 Q61 20 60 30 Q63 40 61 50 Q62 56 60 60 Z" fill="url(#mi4bRock)" stroke="#0A0E1A" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M41 22 Q43 15.4 48 13.4 M35.6 37 Q36.4 29 40.6 23.6" fill="none" stroke="#9575CD" stroke-width="0.7" stroke-opacity="0.6" stroke-linecap="round"/>
    <path d="M57 16 Q60.6 22 59.4 30 M60 40 Q61.6 48 60 56" fill="none" stroke="#FF4081" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M44 18 L47 20 M52 15 L54 18.6 M38 48 L41 50 M56 46 L58.6 44" stroke="#0A0E1A" stroke-width="0.5" stroke-opacity="0.6" stroke-linecap="round"/>
    <!-- algae -->
    <path d="M34 60 Q33 56 34.6 52 M36 60 Q37 57 36 54" fill="none" stroke="#FF80AB" stroke-width="0.6" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- cave maw -->
  <g>
    <path d="M38.6 46 Q38 34 44 28 Q50 24 55 30 Q58.4 36 57 46 Q48 49.4 38.6 46 Z" fill="url(#mi4bMaw)" stroke="#05020A" stroke-width="0.7"/>
    <!-- teeth -->
    <path d="M40.6 33 L43 35.4 L43.6 31 L46 33.6 L47.4 28.6 L49 33 L51.6 28.8 L52 33.4 L54.8 31.4 L54.4 35" fill="#ECEFF1" stroke="#0A0E1A" stroke-width="0.4" stroke-linejoin="round"/>
    <path d="M40 45.4 L42 41.6 L43.6 46 L46 41 L48 46.6 L50.4 41.2 L52.2 46.4 L54.4 41.8 L56 45.8" fill="#CFD8DC" stroke="#0A0E1A" stroke-width="0.4" stroke-linejoin="round"/>
    <!-- glowing eyes -->
    <circle cx="47" cy="37.6" r="2.6" fill="#FF1744" fill-opacity="0.3"/>
    <circle cx="53" cy="37.4" r="2.6" fill="#FF1744" fill-opacity="0.3"/>
    <path d="M45.2 37.8 Q47 36 48.8 37.6 Q47 38.8 45.2 37.8 Z" fill="#FF5252"/>
    <path d="M51.2 37.6 Q53 35.8 54.8 37.4 Q53 38.6 51.2 37.6 Z" fill="#FF5252"/>
    <path d="M47 36.8 V38.4 M53 36.6 V38.2" stroke="#1A0612" stroke-width="0.5"/>
  </g>

