    <path d="M58.6 14 Q55 11 50.6 13.4 Q49.4 14.2 50.6 15 Q55 17.4 58.6 14 Z" fill="url(#r1Fish2)" stroke="#0A0E1A" stroke-width="0.45"/>
    <path d="M58.2 14 L61.2 11.8 L60.6 14 L61.2 16.2 Z" fill="#26C6DA" stroke="#0A0E1A" stroke-width="0.4" stroke-linejoin="round"/>
