    <path d="M0 0 Q4 -2.6 8 0 Q4 2.6 0 0 Z" fill="url(#r1Leaf)" transform="translate(31.4 20) rotate(-36)"/>
    <path d="M0 0 Q4 -2.6 8 0 Q4 2.6 0 0 Z" fill="url(#r1Leaf)" transform="translate(32.6 44) rotate(200)"/>
    <path d="M0 0 Q4 -2.6 8 0 Q4 2.6 0 0 Z" fill="url(#r1Leaf)" transform="translate(21 38) rotate(205)"/>
    <path d="M0 0 Q3.6 -2.4 7.2 0 Q3.6 2.4 0 0 Z" fill="url(#r1Leaf)" transform="translate(21.4 31) rotate(-28)"/>
    <path d="M0 0 Q4 -2.6 8 0 Q4 2.6 0 0 Z" fill="url(#r1Leaf)" transform="translate(43.2 38) rotate(-25)"/>
    <path d="M0 0 Q3.6 -2.4 7.2 0 Q3.6 2.4 0 0 Z" fill="url(#r1Leaf)" transform="translate(42.8 31) rotate(210)"/>
