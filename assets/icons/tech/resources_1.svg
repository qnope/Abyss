    <path d="M6 30 Q10 26.4 15 29 Q16.6 30 15 31 Q10 33.6 6 30 Z" fill="url(#r1Fish)" stroke="#0A0E1A" stroke-width="0.5"/>
    <path d="M6.4 30 L3 27.4 L3.6 30 L3 32.6 Z" fill="#FF8A65" stroke="#0A0E1A" stroke-width="0.45" stroke-linejoin="round"/>
    <path d="M9 27.6 Q11 26.2 12.6 27.6" fill="#FFB74D" stroke="#0A0E1A" stroke-width="0.35"/>
    <path d="M8 29 Q10.6 27.6 13.4 28.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.4" stroke-linecap="round"/>
