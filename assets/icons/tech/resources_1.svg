      <stop offset="1" stop-color="#1DE9B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1Sand" x1="0" y1="44" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E8A6E"/>
      <stop offset="0.4" stop-color="#1F5A48"/>
      <stop offset="1" stop-color="#0B2420"/>
    </linearGradient>
    <linearGradient id="r1Kelp" x1="0" y1="56" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E6B45"/>
      <stop offset="0.55" stop-color="#2FBF7F"/>
      <stop offset="1" stop-color="#B9F6CA"/>
