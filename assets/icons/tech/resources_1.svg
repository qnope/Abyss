    <linearGradient id="r1Fish2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F7FA"/>
      <stop offset="0.5" stop-color="#4DD0E1"/>
      <stop offset="1" stop-color="#00838F"/>
