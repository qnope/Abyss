    <circle cx="6" cy="8" r="1.4" fill-opacity="0.15"/>
    <circle cx="6" cy="8" r="0.45" fill-opacity="0.9"/>
    <circle cx="10" cy="42" r="1.4" fill-opacity="0.15"/>
    <circle cx="10" cy="42" r="0.45" fill-opacity="0.9"/>
    <circle cx="58" cy="26" r="1.4" fill-opacity="0.15"/>
    <circle cx="58" cy="26" r="0.45" fill-opacity="0.9"/>
    <circle cx="24" cy="12" r="1.2" fill-opacity="0.15"/>
    <circle cx="24" cy="12" r="0.4" fill-opacity="0.9"/>
