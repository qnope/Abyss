  <g>
    <path d="M52 34 Q54.4 32.4 56.8 34 Q54.4 35.6 52 34 Z" fill="url(#r1Fish2)" stroke="#0A0E1A" stroke-width="0.35"/>
    <path d="M56.6 34 L58.4 32.8 L58.4 35.2 Z" fill="#26C6DA" stroke="#0A0E1A" stroke-width="0.3"/>
