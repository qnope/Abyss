    <path d="M5.6 54.6 C9 49.6 20 47.4 31 47.3" fill="none" stroke="#B9F6CA" stroke-opacity="0.45" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M58.6 56.6 C55 59 45 59.8 36 60" fill="none" stroke="#1DE9B6" stroke-opacity="0.5" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M10 55 q3 -1 6 0 M44 56 q3 -1 6 0 M24 57.6 q3 -0.8 6 0" fill="none" stroke="#06261C" stroke-opacity="0.6" stroke-width="0.45" stroke-linecap="round"/>
    <ellipse cx="11" cy="53" rx="1.6" ry="1" fill="url(#r1Peb)" stroke="#0A0E1A" stroke-width="0.3"/>
    <ellipse cx="53" cy="54" rx="1.4" ry="0.9" fill="url(#r1Peb)" stroke="#0A0E1A" stroke-width="0.3"/>
    <ellipse cx="38" cy="57.4" rx="1" ry="0.6" fill="url(#r1Peb)" stroke="#0A0E1A" stroke-width="0.3"/>
