    <path d="M25 52.4 q-0.6 -1.6 -1.8 -2 M25 52.4 q0.5 -1.8 1.6 -2.2 M40 52.6 q-0.6 -1.6 -1.8 -2 M40 52.6 q0.5 -1.8 1.6 -2.2" fill="none" stroke="#B9F6CA" stroke-width="0.6" stroke-linecap="round"/>
  </g>

