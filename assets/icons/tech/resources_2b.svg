  <g>
    <path d="M2 40 L10 36 L19 38 L27 34.6 H37 L45 37 L54 35 L62 39 V60 Q32 64 2 60 Z" fill="url(#r2bRock)" stroke="#0A0E1A" stroke-width="0.6"/>
    <path d="M3 40.4 L10 36.8 L19 38.8 L26 35.6" fill="none" stroke="#B0BEC5" stroke-opacity="0.5" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M38 35.4 L45 37.8 L54 35.8 L61.6 39.6" fill="none" stroke="#69F0AE" stroke-opacity="0.45" stroke-width="0.45" stroke-linecap="round"/>
    <path d="M4 47 Q14 45 22 47.6 M42 47.6 Q51 45.4 60 47.4 M3 54 Q12 52.6 22 54.6 M42 54.6 Q52 52.6 61 54.4" fill="none" stroke="#0A0E1A" stroke-opacity="0.6" stroke-width="0.6"/>
    <path d="M4 47.6 Q14 45.6 22 48.2 M42 48.2 Q51 46 60 48" fill="none" stroke="#78909C" stroke-opacity="0.4" stroke-width="0.35"/>
    <!-- cracks from drilling -->
    <path d="M27 52 L22 55 L19 54 M37 52 L42 56 L45 55.4 M28 46 L24 43" fill="none" stroke="#0A0E1A" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M27 52 L22 55 M37 52 L42 56" fill="none" stroke="#FFD740" stroke-opacity="0.5" stroke-width="0.3"/>
  </g>

  <!-- ore crystals embedded -->
  <g stroke="#06183A" stroke-width="0.5" stroke-linejoin="round">
    <path d="M7 49 L9 42.6 L12 41.4 L13.6 47 L11 50.6 Z" fill="url(#r2bOre)"/>
    <path d="M9 42.6 L11 50.6" stroke="#E3F2FD" stroke-opacity="0.6" stroke-width="0.35"/>
    <path d="M12.6 50 L15.4 44.6 L18 46 L17.4 51 Z" fill="url(#r2bOre)"/>
    <path d="M48 50 L50.4 41.6 L53.6 40 L56 46.6 L52.6 51 Z" fill="url(#r2bOre)"/>
    <path d="M50.4 41.6 L52.6 51 M53.6 40 L56 46.6" stroke="#E3F2FD" stroke-opacity="0.6" stroke-width="0.35"/>
    <path d="M45 52 L46.6 47.6 L49 48.6 L48.4 53 Z" fill="url(#r2bOre)"/>
  </g>
  <g fill="#E3F2FD">
    <circle cx="10.2" cy="44" r="0.45"/>
    <circle cx="52" cy="43" r="0.5"/>
    <circle cx="12" cy="45" r="2.6" fill="#42A5F5" fill-opacity="0.18"/>
    <circle cx="52" cy="45" r="3.2" fill="#42A5F5" fill-opacity="0.18"/>
  </g>

  <!-- borehole glow -->
  <ellipse cx="32" cy="50" rx="8" ry="6" fill="url(#r2bHot)"/>

  <!-- drill rig housing -->
  <g>
    <rect x="22" y="6" width="20" height="10" rx="2.4" fill="url(#r2bHousing)" stroke="#06183A" stroke-width="0.6"/>
    <path d="M23.4 7.6 H40.6" stroke="#E0F7FA" stroke-opacity="0.55" stroke-width="0.5" stroke-linecap="round"/>
    <rect x="25" y="9.4" width="14" height="3.4" rx="1.2" fill="#0A0E1A"/>
    <rect x="26" y="10.2" width="5" height="1.8" rx="0.9" fill="#69F0AE"/>
    <rect x="32" y="10.2" width="3" height="1.8" rx="0.9" fill="#FFD740"/>
    <circle cx="37" cy="11.1" r="0.8" fill="#42A5F5"/>
    <circle cx="23.6" cy="14.4" r="0.45" fill="#E0F7FA"/>
    <circle cx="40.4" cy="14.4" r="0.45" fill="#E0F7FA"/>
    <rect x="27" y="16" width="10" height="3.4" rx="0.8" fill="url(#r2bSteel)" stroke="#06183A" stroke-width="0.45"/>
    <path d="M27.4 17.4 H36.6" stroke="#263238" stroke-width="0.35"/>
  </g>

  <!-- drill bit -->
  <g>
    <path d="M26 19.4 H38 L37 40 L32 53 L27 40 Z" fill="url(#r2bSteel)" stroke="#06183A" stroke-width="0.7" stroke-linejoin="round"/>
    <!-- spiral flutes -->
    <path d="M26.2 22 L37.8 25 M26.4 26 L37.6 29.4 M26.6 30.2 L37.4 33.6 M26.8 34.4 L37.2 37.8 M27.2 38.6 L36.6 42" fill="none" stroke="#263238" stroke-width="1.1"/>
    <path d="M26.2 21.2 L37.8 24.2 M26.4 25.2 L37.6 28.6 M26.6 29.4 L37.4 32.8 M26.8 33.6 L37.2 37" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.4"/>
    <path d="M28.6 42 L32 51 L35.4 42" fill="none" stroke="#263238" stroke-width="0.6"/>
    <path d="M29 20 L28.4 39.4" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M37 21 L36.4 38" stroke="#69F0AE" stroke-opacity="0.6" stroke-width="0.5" stroke-linecap="round"/>
    <circle cx="32" cy="52" r="1.4" fill="#FFF8E1"/>
  </g>

  <!-- debris flying -->
  <g fill="#78909C" stroke="#0A0E1A" stroke-width="0.3">
    <path d="M22 48 l-2 -1.4 l1 -1.2 Z"/>
    <path d="M42 47 l2.2 -1 l-0.6 1.8 Z"/>
    <path d="M24.6 44 l-1.6 -0.4 l0.6 -1.2 Z"/>
  </g>
  <g fill="#FFD740">
    <circle cx="25" cy="50" r="0.45"/>
    <circle cx="39.4" cy="50.6" r="0.45"/>
    <circle cx="40.6" cy="45.6" r="0.35"/>
    <circle cx="23" cy="46" r="0.35"/>
  </g>

  <!-- energy spark -->
  <g>
    <circle cx="50" cy="20" r="9" fill="url(#r2bSpark)"/>
    <path d="M51.6 11.6 L45.4 21.6 H50 L47.6 29 L55 17.6 H50.4 Z" fill="url(#r2bBolt)" stroke="#5D3A00" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M50.6 13.4 L47 19.8" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M42 14 L44 15.4 M57.6 24 L59.6 25 M56 12 L58 10.4" stroke="#FFD740" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- ore chunk (left top) -->
  <g>
    <circle cx="13" cy="22" r="6" fill="#42A5F5" fill-opacity="0.15"/>
    <path d="M9 24 L11 16.6 L15 15 L18 20.6 L15.4 26 L11 26.4 Z" fill="url(#r2bOre)" stroke="#06183A" stroke-width="0.55" stroke-linejoin="round"/>
    <path d="M11 16.6 L13.4 21 L18 20.6 M13.4 21 L11 26.4" fill="none" stroke="#06183A" stroke-opacity="0.6" stroke-width="0.35"/>
    <path d="M11.4 17.6 L10 23" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="0.5" stroke-linecap="round"/>
    <circle cx="14.6" cy="16.6" r="0.4" fill="#FFFFFF"/>
  </g>

  <!-- plankton & bubbles -->
  <g fill="#69F0AE">
    <circle cx="5" cy="8" r="1.3" fill-opacity="0.15"/>
    <circle cx="5" cy="8" r="0.45" fill-opacity="0.9"/>
    <circle cx="60" cy="32" r="1.3" fill-opacity="0.15"/>
    <circle cx="60" cy="32" r="0.45" fill-opacity="0.9"/>
  </g>
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.35" stroke-opacity="0.75">
    <circle cx="44" cy="30" r="1.1"/>
    <circle cx="46" cy="26.6" r="0.6"/>
    <circle cx="19" cy="31" r="0.8"/>
  </g>
</svg>
