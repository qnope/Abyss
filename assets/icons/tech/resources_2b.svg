<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="r2bGlow" cx="32" cy="34" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42A5F5" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#69F0AE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#69F0AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r2bRock" x1="0" y1="34" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#546E7A"/>
      <stop offset="0.45" stop-color="#37474F"/>
      <stop offset="1" stop-color="#121A20"/>
    </linearGradient>
    <linearGradient id="r2bHousing" x1="20" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B5E4A"/>
      <stop offset="0.35" stop-color="#4DD9A0"/>
      <stop offset="0.6" stop-color="#26A69A"/>
      <stop offset="1" stop-color="#0B3D2A"/>
    </linearGradient>
    <linearGradient id="r2bSteel" x1="24" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#455A64"/>
      <stop offset="0.35" stop-color="#ECEFF1"/>
      <stop offset="0.65" stop-color="#90A4AE"/>
      <stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="r2bOre" x1="0" y1="0" x2="1" y2="1">
