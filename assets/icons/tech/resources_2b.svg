      <stop offset="0.5" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
    <radialGradient id="r2bSpark" cx="50" cy="20" r="9" gradientUnits="userSpaceOnUse">
