<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="r3Glow" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#69F0AE" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#1DE9B6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00BFA5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r3CurA" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9F6CA"/>
      <stop offset="0.45" stop-color="#69F0AE"/>
      <stop offset="1" stop-color="#00897B"/>
    </linearGradient>
    <linearGradient id="r3CurB" x1="58" y1="10" x2="6" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7FFEB"/>
      <stop offset="0.5" stop-color="#1DE9B6"/>
      <stop offset="1" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="r3CurC" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#004D40"/>
      <stop offset="0.5" stop-color="#26A69A"/>
      <stop offset="1" stop-color="#E0F7FA"/>
    </linearGradient>
    <radialGradient id="r3Core" cx="32" cy="32" r="8" fx="29.6" fy="29.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#B9F6CA"/>
      <stop offset="0.7" stop-color="#1DE9B6"/>
      <stop offset="1" stop-color="#00695C"/>
    </radialGradient>
    <radialGradient id="r3CoreHalo" cx="32" cy="32" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9F6CA" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#69F0AE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#69F0AE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r3Mote" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#B9F6CA"/>
      <stop offset="1" stop-color="#00BFA5"/>
    </radialGradient>
    <radialGradient id="r3MoteGold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFE57F"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </radialGradient>
    <radialGradient id="r3MotePink" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FF9EB5"/>
      <stop offset="1" stop-color="#C2185B"/>
    </radialGradient>
