    <path d="M28 31 V28.4 A4 4 0 0 1 36 28.4 V31" fill="none" stroke="#0A0E1A" stroke-width="2.6"/>
    <path d="M28 31 V28.4 A4 4 0 0 1 36 28.4 V31" fill="none" stroke="url(#r4aRim)" stroke-width="1.5"/>
    <rect x="25.4" y="30.4" width="13.2" height="12" rx="2.2" fill="url(#r4aLock)" stroke="#3E2000" stroke-width="0.7"/>
