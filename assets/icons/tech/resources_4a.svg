    <circle cx="15.5" cy="22" r="0.65"/>
    <circle cx="15.5" cy="34" r="0.65"/>
    <circle cx="15.5" cy="40" r="0.65"/>
    <circle cx="15.5" cy="46" r="0.65"/>
    <circle cx="48.5" cy="16" r="0.65"/>
    <circle cx="48.5" cy="22" r="0.65"/>
    <circle cx="48.5" cy="34" r="0.65"/>
    <circle cx="48.5" cy="40" r="0.65"/>
    <circle cx="48.5" cy="46" r="0.65"/>
    <circle cx="12" cy="53.5" r="0.55"/>
    <circle cx="24" cy="53.5" r="0.55"/>
    <circle cx="40" cy="53.5" r="0.55"/>
    <circle cx="52" cy="53.5" r="0.55"/>
    <circle cx="11" cy="29.7" r="0.5"/>
    <circle cx="53" cy="29.7" r="0.5"/>
