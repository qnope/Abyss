    <path d="M10 36 H54 M10 43 H54 M10 50 H54" stroke="#06140F" stroke-width="0.6"/>
    <path d="M10 36.6 H54 M10 43.6 H54 M10 50.6 H54" stroke="#69F0AE" stroke-opacity="0.18" stroke-width="0.35"/>
    <path d="M10.4 30.6 V53.6" stroke="#B9F6CA" stroke-opacity="0.35" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M53.6 30.6 V53.6" stroke="#1DE9B6" stroke-opacity="0.5" stroke-width="0.5" stroke-linecap="round"/>
