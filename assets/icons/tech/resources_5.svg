  <!-- pearls overflowing -->
  <g stroke="#1A237E" stroke-width="0.4" stroke-opacity="0.7">
    <circle cx="48" cy="40" r="3" fill="url(#r5Pearl)"/>
    <circle cx="44" cy="44.6" r="2.6" fill="url(#r5Pearl)"/>
    <circle cx="51.6" cy="45.4" r="2.8" fill="url(#r5Pearl)"/>
    <circle cx="48.4" cy="49.6" r="2.4" fill="url(#r5Pearl)"/>
    <circle cx="55.4" cy="50.6" r="2.4" fill="url(#r5Pearl)"/>
    <circle cx="59.4" cy="55" r="2" fill="url(#r5Pearl)"/>
    <circle cx="53.4" cy="56" r="1.8" fill="url(#r5Pearl)"/>
    <circle cx="46" cy="57.2" r="1.5" fill="url(#r5Pearl)"/>
    <circle cx="60" cy="46" r="1.4" fill="url(#r5Pearl)"/>
