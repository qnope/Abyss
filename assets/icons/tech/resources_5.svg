  <g fill="#FFFFFF">
    <circle cx="47" cy="38.8" r="0.8"/>
    <circle cx="43.2" cy="43.6" r="0.65"/>
    <circle cx="50.7" cy="44.3" r="0.7"/>
    <circle cx="47.6" cy="48.6" r="0.6"/>
    <circle cx="54.6" cy="49.6" r="0.6"/>
    <circle cx="58.8" cy="54.2" r="0.5"/>
    <circle cx="52.8" cy="55.3" r="0.45"/>
  </g>

  <!-- sparkles -->
  <g stroke="#FFF8E1" stroke-linecap="round" stroke-width="0.7">
    <path d="M26 5 V11 M23 8 H29"/>
    <path d="M60 4 V8 M58 6 H62"/>
    <path d="M18 40 V44 M16 42 H20"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="26" cy="8" r="0.7"/>
    <circle cx="60" cy="6" r="0.5"/>
    <circle cx="18" cy="42" r="0.5"/>
  </g>

  <!-- plankton & bubbles -->
  <g fill="#69F0AE">
    <circle cx="4" cy="30" r="1.3" fill-opacity="0.15"/>
    <circle cx="4" cy="30" r="0.45" fill-opacity="0.9"/>
    <circle cx="8" cy="52" r="1.3" fill-opacity="0.15"/>
    <circle cx="8" cy="52" r="0.45" fill-opacity="0.9"/>
  </g>
  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.35" stroke-opacity="0.75">
    <circle cx="33" cy="6" r="1.2"/>
    <circle cx="36" cy="2.6" r="0.7"/>
  </g>
</svg>
