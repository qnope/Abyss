  <g fill="#E0F7FA" fill-opacity="0.12" stroke="#E0F7FA" stroke-width="0.4" stroke-opacity="0.7">
    <circle cx="50" cy="10" r="1.6"/>
    <circle cx="54" cy="15" r="1"/>
    <circle cx="47" cy="5" r="0.8"/>
