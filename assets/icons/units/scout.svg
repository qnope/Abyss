      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#448AFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#448AFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scSuit" x1="12" y1="42" x2="52" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="0.45" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#0A2A66"/>
    </linearGradient>
    <radialGradient id="scHelm" cx="32" cy="26" r="16" fx="25" fy="17" gradientUnits="userSpaceOnUse">
