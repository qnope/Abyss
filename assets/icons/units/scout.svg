    <circle cx="3" cy="24" r="1.4" fill-opacity="0.15"/>
    <circle cx="3" cy="24" r="0.45" fill-opacity="0.9"/>
    <circle cx="61" cy="26" r="1.4" fill-opacity="0.15"/>
    <circle cx="61" cy="26" r="0.45" fill-opacity="0.9"/>
    <circle cx="58" cy="60" r="1.4" fill-opacity="0.15"/>
    <circle cx="58" cy="60" r="0.45" fill-opacity="0.9"/>
    <circle cx="4" cy="40" r="1.4" fill-opacity="0.15"/>
    <circle cx="4" cy="40" r="0.45" fill-opacity="0.9"/>
