name: abyss
description: ABYSSES - A deep-sea turn-based strategy game.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  # analyzer 14.5 removed an API build_runner 2.16.1 still uses.
  analyzer: ">=12.1.0 <14.5.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/resources/
    - assets/icons/buildings/
    - assets/icons/units/
    - assets/icons/terrain/
    - assets/icons/map_content/
    - assets/icons/tech/
    - assets/icons/events/
    - assets/icons/guide/
